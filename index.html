(function(root){

class Challenge {
  constructor(kind,nodes,options={}) { this.kind=kind;this.nodes=nodes;this.perLap=17;this.max=102;this.score=0;this.checkpoint=0;this.elapsed=0;this.active=false;this.finished=false;this.lastTime=null;this.lastPos=null;this.r=options.radius||14;this.yr=options.verticalRadius||18;this.onChange=()=>{}; }

  pause(now=performance.now()) { if(this.active&&this.lastTime!=null)this.elapsed+=Math.max(0,now-this.lastTime);this.lastTime=null; }
  resume(now=performance.now()){if(this.active&&!this.finished)this.lastTime=now;}
  tick(now=performance.now()){if(this.active&&this.lastTime!=null){this.elapsed+=Math.max(0,now-this.lastTime);this.lastTime=now;}}
  setScore(value) { if(!this.active||this.finished)return;const old=this.score;this.score=Math.max(0,Math.min(this.max,value));const cp=Math.floor(this.score/this.perLap);if(cp>this.checkpoint){this.checkpoint=cp;this.onChange('checkpoint');}if(this.score>=this.max){this.finished=true;this.active=false;this.lastTime=null;this.onChange('finish');}else if(this.score!==old)this.onChange('score'); }
  resetCheckpoint(){if(!this.active||this.finished)return;this.score=this.checkpoint*this.perLap;this.lastPos=null;this.onChange('reset');}
  update(p) {
    if(!this.active||this.finished||this.lastTime==null)return;
    if(this.kind==='cyber'||this.kind==='halloween'){
      const target=this.nodes[(this.score+1)%17]; if(!target)return;
      if(Math.hypot(p.x-target.x,p.z-target.z)<=this.r&&Math.abs(p.y-target.y)<=this.yr)this.setScore(this.score+1);
    } else if(this.kind==='space') {
      let nearest=null,dist=Infinity;for(const n of this.nodes){const d=(p.x-n.x)**2+(p.y-n.y)**2+(p.z-n.z)**2;if(d<dist){nearest=n;dist=d}}
      if(nearest&&dist<=this.r*this.r)this.setScore(Math.max(0,nearest.index-1));
    } else if(this.kind==='snow') {
      if(!this.lastPos){this.lastPos={...p};return}const dist=Math.hypot(p.x-this.lastPos.x,p.y-this.lastPos.y,p.z-this.lastPos.z);if(dist>40){let a=Math.atan2(this.lastPos.z-700,this.lastPos.x),b=Math.atan2(p.z-700,p.x),diff=b-a;while(diff>Math.PI)diff-=2*Math.PI;while(diff< -Math.PI)diff+=2*Math.PI;this.lastPos={...p};this.setScore(this.score+(diff<0?1:-1)*(dist>75?2:1));}
    }
  }

}

        const halloweenNodes=Array.from({length:17},(_,i)=>({x:-700+114*Math.cos(-2*Math.PI*i/17),y:0,z:114*Math.sin(-2*Math.PI*i/17)}));

        function raceBest(key){try{let n=localStorage.getItem(bestKey(key));return n===null?null:Number(n)}catch(e){return null}}
        function updateRaceUI(){const r=races[currentWorld];if(!r)return;let lap=Math.min(6,Math.floor(r.score/17)+1);document.getElementById('race-lap').textContent='圈数 '+lap+'/6';document.getElementById('race-score').textContent='进度 '+r.score+'/102';document.getElementById('race-time').textContent='时间 '+formatRace(r.elapsed);let best=raceBest(currentWorld);document.getElementById('race-best').textContent='最佳 '+(best===null?'—':formatRace(best));document.getElementById('race-start').textContent=r.active?'重新开始':r.finished?'再跑一次':'开始挑战';document.getElementById('race-reset').disabled=!r.active;document.getElementById('race-note').textContent=r.finished?'✓ 挑战完成！用时 '+formatRace(r.elapsed)+(raceMessage?' · '+raceMessage:''):raceMessage|| (r.active ? (currentWorld==='snow'?'沿原冰雪赛道逆时针行驶。':'按顺序驶向发光目标；每 17 点抵达检查点。'):'按顺序完成 6 圈，开始后计时。');}

                const i = Math.floor(Math.log(bytes) / Math.log(1024));
                return `${parseFloat((bytes / Math.pow(1024, i)).toFixed(2))} ${['B', 'KB', 'MB'][i]}`;

            const updateTotalProgress = () => {
                const totalLoaded = assets.envMap.loaded + assets.scene.loaded + assets.tank.loaded;

                if (grandTotal === 0) return;

                loadingBar.style.width = `${progress * 100}%`;

        function setupControls() {
            // Tank Movement
            if (isTouchDevice) {
                const joystickManager = nipplejs.create({ zone: document.getElementById('joystick-container'), mode: 'static', position: { left: '80px', bottom: '80px' }, color: 'rgba(255,255,255,0.5)' });

                    case 'a': case 'arrowleft':  keyboard.turn = -1; break;

                    case ' ': e.preventDefault(); if(currentWorld==='space')flightHeld=true; else if(!e.repeat)handleJump(); break;
                }
            });

            const tapThreshold = 10;
            const pointerDownPos = new THREE.Vector2();

            const onPointerDown = (e) => {
                if (e.target.closest('.ui-button') || e.target.closest('#joystick-container')) return;
                pointerDownPos.set(e.clientX, e.clientY);
                cameraPointers[e.pointerId] = { x: e.clientX, y: e.clientY };
                if (Object.keys(cameraPointers).length === 2) {
                     previousTwoFingerState = getTwoFingerState(Object.values(cameraPointers));
                }
            };

            const onPointerMove = (e) => {
                const pointer = cameraPointers[e.pointerId];
                if (!pointer) return;
                const deltaX = e.clientX - pointer.x;
                const deltaY = e.clientY - pointer.y;
                if (Object.keys(cameraPointers).length === 1) {
                    if (cameraMode === 'tank') {
                        cameraAngle.horizontal -= deltaX * 0.005;
                        cameraAngle.vertical -= deltaY * 0.005;
                        cameraAngle.vertical = Math.max(-Math.PI / 4, Math.min(Math.PI / 2.5, cameraAngle.vertical));
                    } else {
                        camera.rotation.y -= deltaX * 0.004;
                        camera.rotation.x -= deltaY * 0.004;
                        camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
                    }
                } else if (Object.keys(cameraPointers).length === 2 && cameraMode === 'spectator') {
                    pointer.x = e.clientX;
                    pointer.y = e.clientY;
                    handleSpectatorPanAndZoom(Object.values(cameraPointers));
                }
                pointer.x = e.clientX;
                pointer.y = e.clientY;
            };

                if (cameraPointers[e.pointerId]) {

        function getTwoFingerState(pointers) {
            if (pointers.length < 2) return null;
            const t0 = pointers[0];
            const t1 = pointers[1];
            return {
                distance: Math.hypot(t1.x - t0.x, t1.y - t0.y),
                midpoint: { x: (t0.x + t1.x) / 2, y: (t0.y + t1.y) / 2 }
            };
        };

        function handleSpectatorPanAndZoom(pointers) {
            const currentState = getTwoFingerState(pointers);
            if (previousTwoFingerState && currentState) {
                const deltaPanX = currentState.midpoint.x - previousTwoFingerState.midpoint.x;
                const deltaPanY = currentState.midpoint.y - previousTwoFingerState.midpoint.y;
                const deltaPinch = currentState.distance - previousTwoFingerState.distance;
                camera.translateX(-deltaPanX * 0.05);
                camera.translateY(deltaPanY * 0.05);
                camera.translateZ(-deltaPinch * 0.05);
            }
            previousTwoFingerState = currentState;
        };

        function handleJump() {
            if (!tankBody || cameraMode !== 'tank') return;
            const rayOrigin = tankBody.translation();
            const rayDir = { x: 0, y: -1, z: 0 };
            const ray = new RAPIER.Ray(rayOrigin, rayDir);
            const hit = world.castRay(ray, groundRaycastDist, true, null, null, tankBody.collider(0));
            if (hit) {
                tankBody.applyImpulse({ x: 0, y: jumpForce, z: 0 }, true);
            }
        }

        const cameraForward = new THREE.Vector3();
        const cameraRight = new THREE.Vector3();
        const moveDirection = new THREE.Vector3();
        const targetVelocity = new THREE.Vector3();
        const targetQuaternion = new THREE.Quaternion();
        const _matrix = new THREE.Matrix4();
        const upVector = new THREE.Vector3(0, 1, 0);

        function animate() {
            requestAnimationFrame(animate);
            world.step();

            if (tankBody && tankModel) {
                const moveInput = new THREE.Vector2( 
                    Math.abs(joystickVector.x)>0.01 ? joystickVector.x : keyboard.turn, 
                    Math.abs(joystickVector.y)>0.01 ? joystickVector.y : keyboard.forward 
                );
                
                if (cameraMode === 'tank') {
                    camera.getWorldDirection(cameraForward);
                    cameraForward.y = 0;
                    cameraForward.normalize();
                    cameraRight.crossVectors(cameraForward, upVector);
                    moveDirection.set(0, 0, 0);
                    moveDirection.addScaledVector(cameraForward, moveInput.y);
                    moveDirection.addScaledVector(cameraRight, moveInput.x);

                    const currentVel = tankBody.linvel();
                    if(currentWorld==='space' && flightHeld) currentVel.y=18;
                    if (moveDirection.lengthSq() > 0.01) {
                        moveDirection.normalize();
                        targetVelocity.copy(moveDirection).multiplyScalar(maxSpeed);
                        tankBody.setLinvel({ x: targetVelocity.x, y: currentVel.y, z: targetVelocity.z }, true);
                    } else {
                        tankBody.setLinvel({ x: currentVel.x * 0.9, y: currentVel.y, z: currentVel.z * 0.9 }, true);
                    }

                    const lookDirection = moveDirection.lengthSq() > 0.01 ? moveDirection : cameraForward;
                    _matrix.lookAt(tankModel.position, tankModel.position.clone().sub(lookDirection), upVector);
                    targetQuaternion.setFromRotationMatrix(_matrix);
                    if (!tankModel.quaternion.equals(targetQuaternion)) {
                        tankModel.quaternion.slerp(targetQuaternion, turnSpeed);
                        tankBody.setRotation(tankModel.quaternion, true);
                    }
                }

                let position = tankBody.translation();
                if (position.y < (currentWorld === 'space' ? -500 : -120)) {
                    respawnAtCheckpoint();
                    position = tankBody.translation();
                }
                tankModel.position.set(position.x, position.y, position.z);

                if (cameraMode === 'tank') {
                    const rotatedOffset = cameraOffset.clone().applyAxisAngle(upVector, cameraAngle.horizontal);
                    const horizontalAxis = new THREE.Vector3().crossVectors(upVector, rotatedOffset).normalize();
                    rotatedOffset.applyAxisAngle(horizontalAxis, cameraAngle.vertical);
                    const cameraTargetPosition = tankModel.position.clone().add(rotatedOffset);
                    camera.position.lerp(cameraTargetPosition, 0.1);
                    camera.lookAt(tankModel.position.clone().add(new THREE.Vector3(0, 1.5, 0)));
                }
            }
            raceFrame();
            renderer.render(scene, camera);
        };

        async function setupMusicControls() {

                musicButton.disabled = true;

            } 
            function playMusic() { 
                if (isPlaying || !audioBuffer) return; 
                sourceNode = audioContext.createBufferSource(); 
                sourceNode.buffer = audioBuffer; 
                sourceNode.loop = true; 
                sourceNode.connect(audioContext.destination); 
                sourceNode.start(); 
                isPlaying = true; 
                iconOn.style.display = 'inline'; 
                iconOff.style.display = 'none'; 
            } 
            function stopMusic() { 
                if (!isPlaying || !sourceNode) return; 
                sourceNode.stop(); 
                sourceNode.disconnect(); 
                sourceNode = null; 
                isPlaying = false; 
                iconOn.style.display = 'none'; 
                iconOff.style.display = 'inline'; 
            } 
            musicButton.addEventListener('click', (e) => { 
                e.stopPropagation(); 
                if (audioContext.state === 'suspended') { audioContext.resume(); } 
                if (isPlaying) { 
                    stopMusic(); 
                } else { 
                    playMusic(); 
                } 
            }); 
        }
    <\/script>
</body>
</html>
</script>
<script type="text/plain" id="source-cyber">

    <script type="importmap">
        {

<body>
    <!-- 新增：加载屏幕 -->

    <!-- UI Elements -->

    <button id="jump-btn" class="ui-button" aria-label="Jump">
        <svg xmlns="http://www.w3.org/2000/svg" height="48px" viewBox="0 0 24 24" width="48px" fill="#76FF33"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg>

    </button>
    <button id="camera-toggle-btn" class="ui-button" aria-label="Toggle Camera Mode">
        <span id="camera-icon-tank">
             <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#76FF33"><path d="M18 6h-2c0-2.21-1.79-4-4-4S8 3.79 8 6H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm6 12H6V8h12v10z"/><path d="M9.5 12c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5v2.25L15 13v4l-2.5-1.25V18c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5v-6z"/></svg>
        </span>
        <span id="camera-icon-spectator" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#76FF33"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        </span>
    </button>
    <button id="music-toggle-btn" class="ui-button" aria-label="Toggle Music">
        <span id="music-icon-on" style="display: none;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#76FF33"><path d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.2-1.75 4.45-4H15V6h4V3h-7z"/></svg></span>
        <span id="music-icon-off"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#76FF33"><path d="M4.27 3L3 4.27l9 9v.28c-.47-.17-.97-.28-1.5-.28-2.49 0-4.5 2.01-4.5 4.5S8.01 21 10.5 21c2.31 0 4.2-1.75 4.45-4H15v-1.73l5.73 5.73L22 19.73 4.27 3zM15 6h4V3h-7v4.18l2 2z"/></svg></span>
    </button>
    <div id="fullscreen-prompt">Tap to enter fullscreen & lock landscape</div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { EXRLoader } from 'three/addons/loaders/EXRLoader.js';
        import RAPIER from '@dimforge/rapier3d-compat';

        let scene, camera, renderer, world;
        let tankModel, tankBody;
        
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        let audioContext, audioBuffer, sourceNode, isPlaying = false;

        // --- MERGED STATE ---
        let cameraMode = 'tank'; // 'tank' or 'spectator'
        const cameraPointers = {};
        let previousTwoFingerState = null;

        const joystickVector = new THREE.Vector2();
        const keyboard = { forward: 0, turn: 0 };
        const cameraAngle = { horizontal: Math.PI, vertical: 0.4 };
        const cameraOffset = new THREE.Vector3(0, 4, 12);
        
        const maxSpeed = 25.0;
        const turnSpeed = 0.1;
        const jumpForce = 2500;
        const groundRaycastDist = 1.5;
        const initialTankPosition = { x: 0, y: 2, z: 0 };

        init();

        async function init() {
            await RAPIER.init();
            world = new RAPIER.World({ x: 0.0, y: -9.81, z: 0.0 });
            scene = new THREE.Scene();
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.body.appendChild(renderer.domElement);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ'; // Important for spectator controls
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffeeb1, 1);
            directionalLight.position.set(-20, 30, 20);
            scene.add(directionalLight);
            
            await loadAssetsAndPhysics(); // 等待资源加载完成
            
            // 资源加载完成后再初始化控制和UI
            setupControls();
            setupMusicControls();
            setupFullscreen();
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        async function loadAssetsAndPhysics() {
            // --- 设置加载管理器 ---
            const loadingManager = new THREE.LoadingManager();
            const loadingScreen = document.getElementById('loading-screen');
            const loadingBar = document.getElementById('loading-bar');
            const loadingText = document.getElementById('loading-text');

            const assets = {
                envMap: { loaded: 0, total: 0 },
                scene: { loaded: 0, total: 0 },
                tank: { loaded: 0, total: 0 }
            };

            const formatBytes = (bytes) => {
                if (bytes === 0) return '0 B';
                const i = Math.floor(Math.log(bytes) / Math.log(1024));
                return `${parseFloat((bytes / Math.pow(1024, i)).toFixed(2))} ${['B', 'KB', 'MB'][i]}`;
            };

            const updateTotalProgress = () => {
                const totalLoaded = assets.envMap.loaded + assets.scene.loaded + assets.tank.loaded;
                const grandTotal = assets.envMap.total + assets.scene.total + assets.tank.total;
                
                if (grandTotal === 0) return;
                
                const progress = totalLoaded / grandTotal;
                loadingBar.style.width = `${progress * 100}%`;
                loadingText.textContent = `Loading: ${formatBytes(totalLoaded)} / ${formatBytes(grandTotal)}`;
            };
            
            loadingManager.onLoad = () => {
                // 加载完成后，淡出加载屏幕
                loadingScreen.style.opacity = '0';
                loadingScreen.addEventListener('transitionend', () => {
                    loadingScreen.style.display = 'none';
                }, { once: true });
            };

            loadingManager.onError = (url) => {
                console.error('Error loading asset:', url);
                loadingText.textContent = 'Error loading assets. Please refresh.';
            };
            
            const exrLoader = new EXRLoader(loadingManager);
            const gltfLoader = new GLTFLoader(loadingManager);

            // --- 创建一个带进度追踪的加载 Promise ---
            const loadWithProgress = (loader, url, assetTracker) => {
                return new Promise((resolve, reject) => {
                    loader.load(url, resolve, (progress) => {
                        if (progress.lengthComputable) {
                            assetTracker.loaded = progress.loaded;
                            assetTracker.total = progress.total;
                            updateTotalProgress();
                        }
                    }, reject);
                });
            };

            try {
                // 并行加载所有资源
                const [texture, sceneGltf, tankGltf] = await Promise.all([
                    loadWithProgress(exrLoader, 'assets/Minigame_Synth_Environment_4096x2048.exr', assets.envMap),
                    loadWithProgress(gltfLoader, 'assets/Minigame_Synth_Scene.glb', assets.scene),
                    loadWithProgress(gltfLoader, 'assets/Minigame_Synth_Tank.glb', assets.tank)
                ]);

                // --- 所有资源加载完成，开始处理它们 ---
                texture.mapping = THREE.EquirectangularReflectionMapping;
                scene.background = texture;
                scene.environment = texture;
                
                const sceneModel = sceneGltf.scene;
                scene.add(sceneModel);
                const sceneBody = world.createRigidBody(RAPIER.RigidBodyDesc.fixed());
                sceneModel.traverse(child => {
                    if (child.isMesh) {
                        child.receiveShadow = true;
                        child.updateWorldMatrix(true, true);
                        const geometry = child.geometry;
                        if (!geometry.attributes.position || !geometry.index) return;
                        const vertices = geometry.attributes.position.array.slice();
                        const indices = geometry.index.array.slice();
                        for (let i = 0; i < vertices.length; i += 3) {
                            const vertex = new THREE.Vector3(vertices[i], vertices[i + 1], vertices[i + 2]);
                            vertex.applyMatrix4(child.matrixWorld);
                            vertices[i] = vertex.x;
                            vertices[i + 1] = vertex.y;
                            vertices[i + 2] = vertex.z;
                        }
                        const trimeshDesc = RAPIER.ColliderDesc.trimesh(new Float32Array(vertices), indices);
                        world.createCollider(trimeshDesc, sceneBody);
                    }
                });
                
                tankModel = tankGltf.scene;
                tankModel.position.set(initialTankPosition.x, initialTankPosition.y, initialTankPosition.z);
                scene.add(tankModel);
                const bodyDesc = RAPIER.RigidBodyDesc.dynamic().setTranslation(tankModel.position.x, tankModel.position.y, tankModel.position.z).setLinearDamping(0.5).setAngularDamping(0.8).setCanSleep(false);
                tankBody = world.createRigidBody(bodyDesc);
                const allVertices = [];
                tankModel.traverse(child => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        const positions = child.geometry.attributes.position.array;
                        for (let i = 0; i < positions.length; i += 3) { allVertices.push(positions[i], positions[i+1], positions[i+2]); }
                    }
                });
                const colliderDesc = RAPIER.ColliderDesc.convexHull(new Float32Array(allVertices));
                world.createCollider(colliderDesc, tankBody);

            } catch (error) {
                console.error("An error occurred during asset loading:", error);
                // 在加载屏幕上显示错误
                loadingText.textContent = 'Error loading assets. Please refresh.';
            }
        }

        function updateUiForCameraMode() {
            const joystickEl = document.getElementById('joystick-container');
            const jumpBtnEl = document.getElementById('jump-btn');
            const cameraIconTank = document.getElementById('camera-icon-tank');
            const cameraIconSpectator = document.getElementById('camera-icon-spectator');

            if (cameraMode === 'tank') {
                joystickEl.style.display = 'block';
                jumpBtnEl.style.display = 'flex';
                cameraIconTank.style.display = 'none';
                cameraIconSpectator.style.display = 'inline';
            } else { // 'spectator'
                joystickEl.style.display = 'none';
                jumpBtnEl.style.display = 'none';
                cameraIconTank.style.display = 'inline';
                cameraIconSpectator.style.display = 'none';
            }
        }

        function setupControls() {
            // Tank Movement
            if (isTouchDevice) {
                const joystickManager = nipplejs.create({ zone: document.getElementById('joystick-container'), mode: 'static', position: { left: '80px', bottom: '80px' }, color: 'rgba(255,255,255,0.5)' });
                joystickManager.on('move', (evt, data) => { joystickVector.set(data.vector.x, data.vector.y); }).on('end', () => { joystickVector.set(0, 0); });
            }
            document.addEventListener('keydown', (e) => {
                switch (e.key.toLowerCase()) {
                    case 'w': case 'arrowup':    keyboard.forward = 1; break;
                    case 's': case 'arrowdown':  keyboard.forward = -1; break;
                    case 'a': case 'arrowleft':  keyboard.turn = -1; break;
                    case 'd': case 'arrowright': keyboard.turn = 1; break;
                    case ' ':                    handleJump(); break;
                }
            });
            document.addEventListener('keyup', (e) => {
                switch (e.key.toLowerCase()) {
                    case 'w': case 'arrowup': case 's': case 'arrowdown':  keyboard.forward = 0; break;
                    case 'a': case 'arrowleft': case 'd': case 'arrowright': keyboard.turn = 0; break;
                }
            });

            // --- UNIFIED CAMERA CONTROLS ---
            const tapThreshold = 10;
            const pointerDownPos = new THREE.Vector2();

            const onPointerDown = (e) => {
                if (e.target.closest('.ui-button') || e.target.closest('#joystick-container')) return;
                pointerDownPos.set(e.clientX, e.clientY);
                cameraPointers[e.pointerId] = { x: e.clientX, y: e.clientY };
                if (Object.keys(cameraPointers).length === 2) {
                     previousTwoFingerState = getTwoFingerState(Object.values(cameraPointers));
                }
            };

            const onPointerMove = (e) => {
                const pointer = cameraPointers[e.pointerId];
                if (!pointer) return;
                const deltaX = e.clientX - pointer.x;
                const deltaY = e.clientY - pointer.y;
                if (Object.keys(cameraPointers).length === 1) {
                    if (cameraMode === 'tank') {
                        cameraAngle.horizontal -= deltaX * 0.005;
                        cameraAngle.vertical -= deltaY * 0.005;
                        cameraAngle.vertical = Math.max(-Math.PI / 4, Math.min(Math.PI / 2.5, cameraAngle.vertical));
                    } else {
                        camera.rotation.y -= deltaX * 0.004;
                        camera.rotation.x -= deltaY * 0.004;
                        camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
                    }
                } else if (Object.keys(cameraPointers).length === 2 && cameraMode === 'spectator') {
                    pointer.x = e.clientX;
                    pointer.y = e.clientY;
                    handleSpectatorPanAndZoom(Object.values(cameraPointers));
                }
                pointer.x = e.clientX;
                pointer.y = e.clientY;
            };

            const onPointerUpOrCancel = (e) => {
                if (cameraPointers[e.pointerId]) {
                    const dragDistance = pointerDownPos.distanceTo(new THREE.Vector2(e.clientX, e.clientY));
                    if (dragDistance < tapThreshold && Object.keys(cameraPointers).length === 1) {
                        handleFullscreenRequest();
                    }
                }
                const wasTwoFingers = Object.keys(cameraPointers).length === 2;
                delete cameraPointers[e.pointerId];
                if (wasTwoFingers && Object.keys(cameraPointers).length === 1) {
                    const remainingPointerId = Object.keys(cameraPointers)[0];
                    const remainingPointer = cameraPointers[remainingPointerId];
                    const remainingTouch = Array.from(e.touches).find(t => t.identifier == remainingPointerId);
                    if (remainingTouch) {
                        remainingPointer.x = remainingTouch.clientX;
                        remainingPointer.y = remainingTouch.clientY;
                    }
                }
                if (Object.keys(cameraPointers).length < 2) {
                    previousTwoFingerState = null;
                }
            };
            
            renderer.domElement.addEventListener('pointerdown', onPointerDown);
            renderer.domElement.addEventListener('pointermove', onPointerMove);
            renderer.domElement.addEventListener('pointerup', onPointerUpOrCancel);
            renderer.domElement.addEventListener('pointercancel', onPointerUpOrCancel);
            renderer.domElement.addEventListener('pointerleave', onPointerUpOrCancel);

            const jumpButton = document.getElementById('jump-btn');
            const resetButton = document.getElementById('reset-btn');
            const cameraToggleButton = document.getElementById('camera-toggle-btn');
            jumpButton.addEventListener('pointerdown', (e) => { e.preventDefault(); handleJump(); });
            resetButton.addEventListener('pointerdown', (e) => { e.preventDefault(); resetTank(); });
            cameraToggleButton.addEventListener('click', (e) => {
                e.stopPropagation();
                cameraMode = cameraMode === 'tank' ? 'spectator' : 'tank';
                updateUiForCameraMode();
            });

            const resetTank = () => {
                if (!tankBody) return;
                tankBody.setLinvel({ x: 0, y: 0, z: 0 }, true);
                tankBody.setAngvel({ x: 0, y: 0, z: 0 }, true);
                tankBody.setTranslation(initialTankPosition, true);
                tankBody.setRotation({ x: 0, y: 0, z: 0, w: 1 }, true);
            };

            updateUiForCameraMode();
        }

        function getTwoFingerState(pointers) {
            if (pointers.length < 2) return null;
            const t0 = pointers[0];
            const t1 = pointers[1];
            return {
                distance: Math.hypot(t1.x - t0.x, t1.y - t0.y),
                midpoint: { x: (t0.x + t1.x) / 2, y: (t0.y + t1.y) / 2 }
            };
        };

        function handleSpectatorPanAndZoom(pointers) {
            const currentState = getTwoFingerState(pointers);
            if (previousTwoFingerState && currentState) {
                const deltaPanX = currentState.midpoint.x - previousTwoFingerState.midpoint.x;
                const deltaPanY = currentState.midpoint.y - previousTwoFingerState.midpoint.y;
                const deltaPinch = currentState.distance - previousTwoFingerState.distance;
                camera.translateX(-deltaPanX * 0.05);
                camera.translateY(deltaPanY * 0.05);
                camera.translateZ(-deltaPinch * 0.05);
            }
            previousTwoFingerState = currentState;
        };

        function handleJump() {
            if (!tankBody || cameraMode !== 'tank') return;
            const rayOrigin = tankBody.translation();
            const rayDir = { x: 0, y: -1, z: 0 };
            const ray = new RAPIER.Ray(rayOrigin, rayDir);
            const hit = world.castRay(ray, groundRaycastDist, true, null, null, tankBody.collider(0));
            if (hit) {
                tankBody.applyImpulse({ x: 0, y: jumpForce, z: 0 }, true);
            }
        }

        const cameraForward = new THREE.Vector3();
        const cameraRight = new THREE.Vector3();
        const moveDirection = new THREE.Vector3();
        const targetVelocity = new THREE.Vector3();
        const targetQuaternion = new THREE.Quaternion();
        const _matrix = new THREE.Matrix4();
        const upVector = new THREE.Vector3(0, 1, 0);

        function animate() {
            requestAnimationFrame(animate);
            world.step();

            if (tankBody && tankModel) {
                const moveInput = new THREE.Vector2( 
                    isTouchDevice ? joystickVector.x : keyboard.turn, 
                    isTouchDevice ? joystickVector.y : keyboard.forward 
                );
                
                if (cameraMode === 'tank') {
                    camera.getWorldDirection(cameraForward);
                    cameraForward.y = 0;
                    cameraForward.normalize();
                    cameraRight.crossVectors(cameraForward, upVector);
                    moveDirection.set(0, 0, 0);
                    moveDirection.addScaledVector(cameraForward, moveInput.y);
                    moveDirection.addScaledVector(cameraRight, moveInput.x);

                    const currentVel = tankBody.linvel();
                    if (moveDirection.lengthSq() > 0.01) {
                        moveDirection.normalize();
                        targetVelocity.copy(moveDirection).multiplyScalar(maxSpeed);
                        tankBody.setLinvel({ x: targetVelocity.x, y: currentVel.y, z: targetVelocity.z }, true);
                    } else {
                        tankBody.setLinvel({ x: currentVel.x * 0.9, y: currentVel.y, z: currentVel.z * 0.9 }, true);
                    }

                    const lookDirection = moveDirection.lengthSq() > 0.01 ? moveDirection : cameraForward;
                    _matrix.lookAt(tankModel.position, tankModel.position.clone().sub(lookDirection), upVector);
                    targetQuaternion.setFromRotationMatrix(_matrix);
                    if (!tankModel.quaternion.equals(targetQuaternion)) {
                        tankModel.quaternion.slerp(targetQuaternion, turnSpeed);
                        tankBody.setRotation(tankModel.quaternion, true);
                    }
                }

                const position = tankBody.translation();
                tankModel.position.set(position.x, position.y, position.z);

                if (cameraMode === 'tank') {
                    const rotatedOffset = cameraOffset.clone().applyAxisAngle(upVector, cameraAngle.horizontal);
                    const horizontalAxis = new THREE.Vector3().crossVectors(upVector, rotatedOffset).normalize();
                    rotatedOffset.applyAxisAngle(horizontalAxis, cameraAngle.vertical);
                    const cameraTargetPosition = tankModel.position.clone().add(rotatedOffset);
                    camera.position.lerp(cameraTargetPosition, 0.1);
                    camera.lookAt(tankModel.position.clone().add(new THREE.Vector3(0, 1.5, 0)));
                }
            }
            renderer.render(scene, camera);
        };
        
        function onWindowResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); };
        
        function handleFullscreenRequest() { if (!document.fullscreenElement) { document.documentElement.requestFullscreen().then(() => { if (isTouchDevice && screen.orientation && typeof screen.orientation.lock === 'function') { screen.orientation.lock('landscape').catch(() => {}); } }).catch(() => {}); } }
        
        function setupFullscreen() { 
            const prompt = document.getElementById('fullscreen-prompt'); 
            if (isTouchDevice) { 
                setTimeout(() => { prompt.style.opacity = '1'; }, 2000); 
                setTimeout(() => { prompt.style.opacity = '0'; }, 7000); 
            }
            document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) { if (screen.orientation && typeof screen.orientation.unlock === 'function') { screen.orientation.unlock(); } } }); 
        };

        async function setupMusicControls() { 
            const musicButton = document.getElementById('music-toggle-btn'); 
            const iconOn = document.getElementById('music-icon-on'); 
            const iconOff = document.getElementById('music-icon-off'); 
            try { 
                const response = await fetch('assets/bounce tanki loop cut (no intro).opus'); 
                const arrayBuffer = await response.arrayBuffer(); 
                audioContext = THREE.AudioContext.getContext(); 
                audioBuffer = await audioContext.decodeAudioData(arrayBuffer); 
            } catch (error) { 
                console.error('Failed to load or decode audio file:', error); 
                musicButton.disabled = true; 
                return; 
            } 
            function playMusic() { 
                if (isPlaying || !audioBuffer) return; 
                sourceNode = audioContext.createBufferSource(); 
                sourceNode.buffer = audioBuffer; 
                sourceNode.loop = true; 
                sourceNode.connect(audioContext.destination); 
                sourceNode.start(); 
                isPlaying = true; 
                iconOn.style.display = 'inline'; 
                iconOff.style.display = 'none'; 
            } 
            function stopMusic() { 
                if (!isPlaying || !sourceNode) return; 
                sourceNode.stop(); 
                sourceNode.disconnect(); 
                sourceNode = null; 
                isPlaying = false; 
                iconOn.style.display = 'none'; 
                iconOff.style.display = 'inline'; 
            } 
            musicButton.addEventListener('click', (e) => { 
                e.stopPropagation(); 
                if (audioContext.state === 'suspended') { audioContext.resume(); } 
                if (isPlaying) { 
                    stopMusic(); 
                } else { 
                    playMusic(); 
                } 
            }); 
        }
    <\/script>

        // --- Physics Helpers ---

        function createTrimeshBody(mesh) {
            const geometry = mesh.geometry;
            const vertices = [];
            const indices = [];

            mesh.updateMatrixWorld(true);
            const matrix = mesh.matrixWorld;
            const v = new THREE.Vector3();

            if (geometry.index) {
                for (let i = 0; i < geometry.index.count; i++) {
                    indices.push(geometry.index.array[i]);
                }
                for (let i = 0; i < geometry.attributes.position.count; i++) {
                    v.fromBufferAttribute(geometry.attributes.position, i);
                    v.applyMatrix4(matrix);
                    vertices.push(v.x, v.y, v.z);
                }
            } else {
                for (let i = 0; i < geometry.attributes.position.count; i++) {
                    v.fromBufferAttribute(geometry.attributes.position, i);
                    v.applyMatrix4(matrix);
                    vertices.push(v.x, v.y, v.z);
                    indices.push(i);
                }
            }

            const shape = new RapierBridge.Trimesh(vertices, indices);
            const body = new RapierBridge.Body({ mass: 0, material: defaultMaterial });
            body.addShape(shape);
            body.position.set(0,0,0); 
            return body;
        }

        // Scoring Logic Function
        function checkScoring() {
            if (!tankBody || !gameState.isPlaying) return;

            const currentPos = new THREE.Vector3(tankBody.position.x, tankBody.position.y, tankBody.position.z);
            const dist = currentPos.distanceTo(gameState.lastScorePos);
            
            if (dist > 40) {
                const lastAngle = Math.atan2(gameState.lastScorePos.z, gameState.lastScorePos.x);
                const currentAngle = Math.atan2(currentPos.z, currentPos.x);
                
                let diff = currentAngle - lastAngle;
                while (diff > Math.PI) diff -= 2 * Math.PI;
                while (diff < -Math.PI) diff += 2 * Math.PI;
                
                let points = 1;
                if (dist > 75) points = 2;
                
                const oldDisplayScore = Math.max(0, gameState.score);
                
                if (diff < 0) {
                    if (gameState.score < GAME_CONFIG.maxScore) {
                        gameState.score += points;
                        if (gameState.score > GAME_CONFIG.maxScore) gameState.score = GAME_CONFIG.maxScore;
                    }
                } else {
                    gameState.score -= points;
                }
                
                const newDisplayScore = Math.max(0, gameState.score);
                const scoreDiff = newDisplayScore - oldDisplayScore;
                
                updateScoreDisplay();
                gameState.lastScorePos.copy(currentPos);
                
                if (scoreDiff !== 0) {
                     const oldLap = Math.floor(oldDisplayScore / GAME_CONFIG.pointsPerLap) + 1;
                     const newLap = Math.floor(newDisplayScore / GAME_CONFIG.pointsPerLap) + 1;
                     
                     if ((newLap > oldLap && newLap <= GAME_CONFIG.maxLaps) || newDisplayScore === GAME_CONFIG.maxScore) {
                         playSound('sfx-lap');
                         if (newLap <= GAME_CONFIG.maxLaps && newLap > oldLap) {
                             showLapEffect(newLap);
                         }

            if (scoreDiff > 0) {
                // 加分时的文字提示
                showFloatingText(scoreDiff > 1 ? "+" + scoreDiff + " " + t.double : "+" + scoreDiff, currentPos);
            } else {
                // 减分时的文字提示
                showFloatingText(scoreDiff + " " + t.back, currentPos, true);
            }
                }
            }
        }

        // Load Tank
        gltfLoader.load(ASSETS.tank, (gltf) => {
            tankMesh = gltf.scene;
            scene.add(tankMesh);
            
            tankMesh.traverse(c => { 
                if(c.isMesh) { 
                    c.castShadow=true; 
                    c.receiveShadow=true; 
                    if(c.material && c.material.map) c.material.map.anisotropy = maxAnisotropy; // High Quality
                } 
            });

            const shape = new RapierBridge.Sphere(PHYSICS.tankRadius);
            tankBody = new RapierBridge.Body({
                mass: PHYSICS.tankMass,
                material: defaultMaterial,
                shape: shape,
                angularDamping: 0.9,
                linearDamping: 0.05 // Very low for sliding
            });
            tankBody.position.set(0, 10, 167); 
            world.addBody(tankBody);
            
            tankBody.addEventListener('collide', (e) => {
                const contactNormal = new RapierBridge.Vec3();
                e.contact.ni.negate(contactNormal); 
                
                if (contactNormal.dot(new RapierBridge.Vec3(0, 1, 0)) > 0.5) {
                    if (tankBody.velocity.y < 20) {
                        const jumpSound = document.getElementById('sfx-jump');
                        if(jumpSound) { jumpSound.pause(); jumpSound.currentTime = 0; }
                    }

                    canJump = true;
                    lastGroundedTime = clock.getElapsedTime();
                    checkScoring();
                }
            });
            
            // Initial angle calculation
            gameState.lastTankMapAngle = Math.atan2(tankBody.position.x, tankBody.position.z);
        });

        // --- Controls ---
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickActive = false;
        let joystickOrigin = { x: 0, y: 0 };
        let joystickId = null;

        // Touch Joystick
        joystickZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation(); 
            const touch = e.changedTouches[0];
            joystickId = touch.identifier;
            joystickActive = true;
            const rect = joystickZone.getBoundingClientRect();
            joystickOrigin = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
            updateJoystick(touch.clientX, touch.clientY);
        });

        joystickZone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if(!joystickActive) return;
            for(let i=0; i<e.changedTouches.length; i++) {
                if(e.changedTouches[i].identifier === joystickId) {
                    updateJoystick(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                    break;
                }
            }
        });

        const endJoystick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            if(!joystickActive) return;
            for(let i=0; i<e.changedTouches.length; i++) {
                if(e.changedTouches[i].identifier === joystickId) {
                    joystickActive = false;
                    input.joyX = 0; 
                    input.joyY = 0;
                    joystickKnob.style.transform = `translate(-50%, -50%)`;
                    break;
                }
            }
        };
        joystickZone.addEventListener('touchend', endJoystick);
        joystickZone.addEventListener('touchcancel', endJoystick);

        function updateJoystick(clientX, clientY) {
            const maxDist = 45; 
            let dx = clientX - joystickOrigin.x;
            let dy = clientY - joystickOrigin.y;
            
            const dist = Math.sqrt(dx*dx + dy*dy);
            if(dist > maxDist) {
                const ratio = maxDist / dist;
                dx *= ratio;
                dy *= ratio;
            }
            
            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            
            input.joyX = dx / maxDist;
            input.joyY = dy / maxDist;
        }

        // Touch Jump
        const jumpBtn = document.getElementById('jump-btn');
        jumpBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation();
            input.jump = true;
        });
        jumpBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            e.stopPropagation();
            input.jump = false;
        });

        // Keyboard
        window.addEventListener('keydown', (e) => {
            if(!gameState.isPlaying) return;
            switch(e.code) {
                case 'KeyW': case 'ArrowUp': input.keyForward = 1; break;
                case 'KeyS': case 'ArrowDown': input.keyForward = -1; break;
                case 'KeyA': case 'ArrowLeft': input.keyTurn = 1; break;
                case 'KeyD': case 'ArrowRight': input.keyTurn = -1; break;
                case 'Space': input.jump = true; break;
            }
        });
        window.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': case 'ArrowUp': if(input.keyForward > 0) input.keyForward = 0; break;
                case 'KeyS': case 'ArrowDown': if(input.keyForward < 0) input.keyForward = 0; break;
                case 'KeyA': case 'ArrowLeft': if(input.keyTurn > 0) input.keyTurn = 0; break;
                case 'KeyD': case 'ArrowRight': if(input.keyTurn < 0) input.keyTurn = 0; break;
                case 'Space': input.jump = false; break;
            }
        });

        // --- Game Logic ---
        const clock = new THREE.Clock();
        const raycaster = new THREE.Raycaster();
        const downVector = new THREE.Vector3(0, -1, 0);
        
        function updateScoreDisplay() {
            const displayScore = Math.max(0, gameState.score);
            document.getElementById('score-display').innerText = displayScore;

            // Lap Calculation
            let currentLap = Math.floor(displayScore / GAME_CONFIG.pointsPerLap) + 1;
            if (currentLap > GAME_CONFIG.maxLaps) currentLap = GAME_CONFIG.maxLaps;
            if (displayScore === GAME_CONFIG.maxScore) currentLap = GAME_CONFIG.maxLaps;

            // Range Calculation
            const rangeStart = (currentLap - 1) * GAME_CONFIG.pointsPerLap;
            const rangeEnd = currentLap * GAME_CONFIG.pointsPerLap;
            
            document.getElementById('lap-display').innerText = `${t.lap} ${currentLap}/${GAME_CONFIG.maxLaps}`;
            document.getElementById('range-display').innerText = `${rangeStart}-${rangeEnd}`;

            // Check Win Condition
            if (gameState.score >= GAME_CONFIG.maxScore && !gameState.isFinished) {
                gameState.isFinished = true;
                
                // Final Time Logic
                const finalTime = gameState.elapsedTime;
                document.getElementById('win-time').innerText = t.time + formatTime(finalTime);
                
                // Check Best Record
                const currentBest = getBestTime();
                if (currentBest === null || finalTime < currentBest) {
                    saveBestTime(finalTime);
                    document.getElementById('win-time').innerText += ` (${t.newRecord})`;
                }
                
                document.getElementById('win-screen').classList.remove('hidden');
                document.getElementById('ui-layer').classList.remove('pointer-events-none');
            }
        }

        function respawn(mode = 'full') {
            if(!tankBody) return;
            
            // 1. Reset Tank Physics and Position
            tankBody.position.set(0, 15, 167); 
            tankBody.velocity.set(0,0,0);
            tankBody.angularVelocity.set(0,0,0);
            if(tankMesh) tankMesh.rotation.set(0, 0, 0); // Face +X
            
            // Safety: Ensure tank is visible and animation flag is cleared if we force a full respawn
            if (mode === 'full') {
                gameState.isRespawning = false;
                if(tankMesh) tankMesh.visible = true;
            }
            
            // 2. Reset Game Logic
            gameState.lastScorePos.set(0, 15, 167);
            if (gameState.score > 0 && gameState.score < GAME_CONFIG.maxScore) {
                gameState.score = Math.floor(gameState.score / GAME_CONFIG.pointsPerLap) * GAME_CONFIG.pointsPerLap;
            } else if (gameState.score < 0) {
                gameState.score = 0;
            }
            gameState.lastTankMapAngle = 0;
            updateScoreDisplay();

            if (mode === 'silent') return;

            // 3. Reset Camera (Only for full reset)
            const restartTarget = new THREE.Vector3(0, 10, 167);

            // Default Start Position: Behind View (-X axis)
            camera.position.set(restartTarget.x - 40, 45, restartTarget.z);

            // Apply Target
            controls.target.copy(restartTarget);
            smoothedCameraTarget.copy(restartTarget);
            
            // Reset Smoothing and Controls
            cameraInitialized = false;
            controls.update();
        }

        function triggerRespawn() {
            if (gameState.isRespawning) return;

            // Stop jump sound immediately on fall
            const jumpSound = document.getElementById('sfx-jump');
            if(jumpSound) { jumpSound.pause(); jumpSound.currentTime = 0; }

            gameState.isRespawning = true;
            gameState.respawnStartTime = clock.getElapsedTime();

            // Store start state
            gameState.respawnStartPos.copy(camera.position);
            gameState.respawnStartTarget.copy(controls.target);

            // Calculate end state (Spawn Point)
            gameState.respawnEndTarget.set(0, 10, 167);

            // Calculate End Camera Position (Preserving Zoom/Height, enforcing -X angle)
            const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
            const height = offset.y;
            const distXZ = Math.sqrt(offset.x * offset.x + offset.z * offset.z);

            // Set to -X direction relative to target
            gameState.respawnEndPos.set(
                gameState.respawnEndTarget.x - distXZ,
                gameState.respawnEndTarget.y + height,
                gameState.respawnEndTarget.z
            );

            // Reset Physics Immediately (Tank teleports to start)
            respawn('silent');
            
            // Hide tank and move mesh away to prevent "hovering" ghost
            if(tankMesh) {
                tankMesh.visible = false;
                tankMesh.position.set(0, -10000, 0); 
            }
        }

        function easeInOutCubic(x) {
            return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
        }

        // Camera smoothing variables
        const smoothedCameraTarget = new THREE.Vector3();
        let cameraInitialized = false;

        function animate() {
            requestAnimationFrame(animate);
            
            const dt = Math.min(clock.getDelta(), 0.05);
            const now = clock.getElapsedTime();
            
            // Update Timer
            if (gameState.isPlaying && !gameState.isFinished && !document.hidden) {
                gameState.elapsedTime = now - gameState.gameStartTime;
                document.getElementById('game-timer').innerText = formatTime(gameState.elapsedTime);
            }
            
            if (gameState.isRespawning) {
                // Respawn Animation Mode
                const elapsed = now - gameState.respawnStartTime;
                let t = elapsed / gameState.respawnDuration;
                
                if (t >= 1.0) {
                    t = 1.0;
                    gameState.isRespawning = false;
                    // Ensure final snap
                    camera.position.copy(gameState.respawnEndPos);
                    controls.target.copy(gameState.respawnEndTarget);
                    smoothedCameraTarget.copy(gameState.respawnEndTarget);
                    if(tankMesh) tankMesh.visible = true; // Show tank after animation
                } else {
                    t = easeInOutCubic(t);
                    camera.position.lerpVectors(gameState.respawnStartPos, gameState.respawnEndPos, t);
                    controls.target.lerpVectors(gameState.respawnStartTarget, gameState.respawnEndTarget, t);
                }
                controls.update();
                renderer.render(scene, camera);
                return; // Skip other logic
            }

            if(gameState.isPlaying && tankBody && tankMesh) {
                // Raycast Ground Check
                const rayOrigin = tankMesh.position.clone();
                rayOrigin.y += 0.5;
                raycaster.set(rayOrigin, downVector);
                const intersects = raycaster.intersectObjects(collidableMeshes);
                
                if (intersects.length > 0 && intersects[0].distance < 2.5) {
                    if (tankBody.velocity.y < 20) {
                        const jumpSound = document.getElementById('sfx-jump');
                        if(jumpSound) { jumpSound.pause(); jumpSound.currentTime = 0; }
                    }

                    canJump = true;
                    lastGroundedTime = now;
                    checkScoring();
                }

                world.step(1/60, dt, 10);

                // Sync Visuals
                tankMesh.position.copy(tankBody.position);
                tankMesh.position.y -= 1.5; 
                
                // Auto Camera Rotation Logic
                const currentMapAngle = Math.atan2(tankMesh.position.x, tankMesh.position.z);
                
                if (gameState.autoCamera) {
                    let angleDiff = currentMapAngle - gameState.lastTankMapAngle;
                    // Normalize -PI to PI
                    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                    
                    if (Math.abs(angleDiff) > 0.0001 && Math.abs(angleDiff) < 1.0) {
                        // Rotate camera position around target (tank) by same amount
                        // Camera offset from target
                        const camOffset = camera.position.clone().sub(controls.target);
                        
                        // Rotate vector around Y axis
                        camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), angleDiff);
                        
                        // Update camera position
                        camera.position.copy(controls.target).add(camOffset);
                    }
                }
                gameState.lastTankMapAngle = currentMapAngle;


                // Determine Input Mode
                const usingJoystick = (Math.abs(input.joyX) > 0.01 || Math.abs(input.joyY) > 0.01);
                
                // Target Velocity Calculation
                let targetVel = new THREE.Vector3(0,0,0);
                let isMoving = false;

                if (usingJoystick) {
                    // --- Joystick (Directional Relative to Camera) ---
                    
                    // Camera direction
                    const camDir = new THREE.Vector3();
                    camera.getWorldDirection(camDir);
                    camDir.y = 0;
                    camDir.normalize();
                    const camRight = new THREE.Vector3(-camDir.z, 0, camDir.x);
                    
                    // Calculate Move Vector
                    const moveVec = new THREE.Vector3();
                    moveVec.addScaledVector(camDir, -input.joyY); 
                    moveVec.addScaledVector(camRight, input.joyX);
                    
                    if(moveVec.length() > 0.1) {
                        isMoving = true;
                        moveVec.normalize();
                        targetVel.copy(moveVec).multiplyScalar(PHYSICS.moveSpeed);
                        
                        // Rotate Tank towards movement
                        const targetAngle = Math.atan2(targetVel.x, targetVel.z) - Math.PI / 2;
                        let curRot = tankMesh.rotation.y;
                        let diff = targetAngle - curRot;
                        while(diff > Math.PI) diff -= Math.PI*2;
                        while(diff < -Math.PI) diff += Math.PI*2;
                        const maxTurn = PHYSICS.turnSpeed * dt;
                        tankMesh.rotation.y += Math.max(-maxTurn, Math.min(maxTurn, diff));
                    }
                } else {
                    // --- Keyboard (Tank Controls) ---
                    
                    // Rotation (A/D)
                    if(input.keyTurn !== 0) {
                        tankMesh.rotation.y += input.keyTurn * PHYSICS.tankTurnSpeed * dt;
                    }
                    
                    // Movement (W/S)
                    if(input.keyForward !== 0) {
                        isMoving = true;
                        // Tank faces +X when rotation is 0
                        const forwardDir = new THREE.Vector3(1, 0, 0); 
                        forwardDir.applyEuler(tankMesh.rotation);
                        targetVel.copy(forwardDir).multiplyScalar(input.keyForward * PHYSICS.moveSpeed);
                    }
                }
                
                // --- Acceleration & Movement ---
                const currentVel = new THREE.Vector3(tankBody.velocity.x, 0, tankBody.velocity.z);
                
                if(isMoving) {
                    currentVel.lerp(targetVel, PHYSICS.acceleration * dt);
                } else {
                    // Deceleration
                    currentVel.lerp(new THREE.Vector3(0,0,0), PHYSICS.deceleration * dt);
                }
                
                tankBody.velocity.x = currentVel.x;
                tankBody.velocity.z = currentVel.z;

                // --- Jumping ---
                const isGrounded = (now - lastGroundedTime < COYOTE_TIME);

                if(input.jump && isGrounded && !isJumping) {
                    isJumping = true;
                    tankBody.velocity.y = PHYSICS.jumpImpulse;
                    lastGroundedTime = -10.0;
                    canJump = false; 
                    
                    // Play Jump Sound
                    playSound('sfx-jump');
                }

                // Variable Jump Height
                if(!input.jump && isJumping) {
                    if(tankBody.velocity.y > 0) {
                        tankBody.velocity.y *= 0.5;
                    }
                    isJumping = false;
                }

                if(tankBody.velocity.y < 0) isJumping = false;

                // --- Camera Follow ---
                if(!cameraInitialized) {
                    smoothedCameraTarget.copy(tankMesh.position);
                    cameraInitialized = true;
                }

                const camLerpSpeed = 3.0;
                smoothedCameraTarget.lerp(tankMesh.position, camLerpSpeed * dt);
                
                const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
                
                camera.position.copy(smoothedCameraTarget).add(offset);
                controls.target.copy(smoothedCameraTarget);
                
                controls.update();

                // Fall Check
                if(tankBody.position.y < -50 && !gameState.isRespawning) {
                    triggerRespawn();
                }
            } else if ((!gameState.isPlaying || gameState.isFinished) && tankBody && tankMesh) {
                 // Idle rotation
                 const t = Date.now() * 0.0005;
                 camera.position.x = Math.sin(t) * 200;
                 camera.position.z = Math.cos(t) * 200;
                 camera.position.y = 100;
                 camera.lookAt(0, 0, 0);
            } else {
                controls.update();
            }

            renderer.render(scene, camera);
        }

        // --- Sound ---
        function playSound(id) {
            const el = document.getElementById(id);
            if(el) {
                el.currentTime = 0;
                el.play().catch(()=>{});
            }
        }

        // --- Interaction ---
        // UI Logic
        const aboutBtn = document.getElementById('about-btn');
        const camToggleBtn = document.getElementById('cam-toggle-btn');
        const soundBtn = document.getElementById('sound-btn');
        const closeAboutBtn = document.getElementById('close-about-btn');
        const aboutModal = document.getElementById('about-modal');
        const startScreen = document.getElementById('start-screen');
        const audioElements = document.querySelectorAll('audio');
        
        document.addEventListener('click', () => {
            if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen()
                    .then(() => {
                        if (screen.orientation && screen.orientation.lock) {
                            screen.orientation.lock('landscape').catch(() => {});
                        }
                    })
                    .catch(() => {});
            }
        });

        aboutBtn.addEventListener('click', () => {
            aboutModal.classList.remove('hidden');
        });

        closeAboutBtn.addEventListener('click', () => {
            aboutModal.classList.add('hidden');
        });

        // Toggle Auto Camera
        camToggleBtn.addEventListener('click', () => {
            gameState.autoCamera = !gameState.autoCamera;
            if (gameState.autoCamera) {
                camToggleBtn.classList.add('active');
            } else {
                camToggleBtn.classList.remove('active');
            }
        });

        // Toggle Sound
        function updateSoundState() {
            const icon = soundBtn.querySelector('.material-symbols-rounded');
            if (gameState.soundEnabled) {
                soundBtn.classList.add('active');
                icon.innerText = 'volume_up';
                audioElements.forEach(el => {
                    el.muted = false;
                    // Ensure bg music is playing if game is active
                    if (el.id === 'bg-music' && gameState.isPlaying) {
                        el.play().catch(()=>{});
                    }
                });
            } else {
                soundBtn.classList.remove('active');
                icon.innerText = 'volume_off';
                audioElements.forEach(el => el.muted = true);
            }
        }

        soundBtn.addEventListener('click', () => {
            gameState.soundEnabled = !gameState.soundEnabled;
            updateSoundState();
        });

        // Initialize Sound State (Default Off)
        gameState.soundEnabled = false;
        updateSoundState();


        const resetBtn = document.getElementById('reset-btn');
        resetBtn.addEventListener('click', resetGameLogic);

        const startGame = () => {
            if(!gameState.assetsLoaded || gameState.isPlaying) return;
            
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
            if(screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
            
            if(window.matchMedia("(pointer: coarse)").matches) {
                document.getElementById('touch-ui').style.display = 'block';
            }

            gameState.isPlaying = true;
            // Set start time for timer
            gameState.gameStartTime = clock.getElapsedTime();
            
            startScreen.classList.add('opacity-0');
            startScreen.classList.add('pointer-events-none');
            setTimeout(() => startScreen.classList.add('hidden'), 500);
            
            const bgMusic = document.getElementById('bg-music');
            bgMusic.volume = 0.4;
            bgMusic.play().catch(()=>{});
            
            updateScoreDisplay();
            respawn('full');
        };

        // startBtn is now a div, but can still trigger start
        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startGame();
        });

        startScreen.addEventListener('click', startGame);
        
        window.addEventListener('keydown', (e) => {
            if (!gameState.isPlaying && gameState.assetsLoaded && !startScreen.classList.contains('hidden')) {
                startGame();
            }
        });

        const winScreen = document.getElementById('win-screen');
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if(mutation.target.classList.contains('hidden')) {
                   document.getElementById('ui-layer').classList.add('pointer-events-none');
                   document.querySelector('.header-row').classList.add('pointer-events-auto');
                } else {
                   document.getElementById('ui-layer').classList.remove('pointer-events-none');
                }
            });
        });
        observer.observe(winScreen, { attributes: true, attributeFilter: ['class'] });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    <\/script>
</body>
</html>
</script>
<script type="text/plain" id="source-space">
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>太空中的坦克（玩法重构）</title>
    
    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    
    <!-- Google Fonts: Rubik & M PLUS 1p -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
        -webkit-tap-highlight-color: transparent;
        }
        :root {
            /* Dark Theme Token Palette - Custom Green/DarkBlue */
            --md-sys-color-primary: #FFCC00;
            --md-sys-color-on-primary: #001926;
            --md-sys-color-primary-container: rgba(255, 204, 0, 0.2);
            --md-sys-color-on-primary-container: #FFCC00;
            --md-sys-color-secondary: #CCC2DC;
            --md-sys-color-on-secondary: #332D41;
            --md-sys-color-secondary-container: #4A4458;
            --md-sys-color-on-secondary-container: #E8DEF8;
            --md-sys-color-tertiary: #FF6666;
            --md-sys-color-on-tertiary: #492532;
            --md-sys-color-tertiary-container: #633B48;
            --md-sys-color-on-tertiary-container: #FFD8E4;
            --md-sys-color-surface: #001926;
            --md-sys-color-on-surface: #BFD5FF;
            --md-sys-color-surface-variant: rgba(255, 255, 255, 0.1);
            --md-sys-color-on-surface-variant: #CAC4D0;
            --md-sys-color-outline: #938F99;
            --md-sys-color-surface-container: #1D1B20;
            --md-sys-color-surface-container-high: rgba(0, 25, 38, 0.5);
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            font-family: 'Rubik', 'M PLUS 1p', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            opacity: 0; /* Hidden initially for font loading */
            transition: opacity 0.5s ease-in-out;
        }

        h1, h2, h3, p { margin: 0; }

        /* --- Components --- */

        .material-symbols-rounded { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

        /* Cards */
        .m3-card {
            background-color: rgba(0, 25, 38, 0.6);
            color: var(--md-sys-color-on-surface);
            border-radius: 28px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2), 0 0 0 1px rgba(255,255,255,0.1);
            padding: 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        
        .m3-card.compact {
            border-radius: 16px;
            padding: 12px 24px;
            background-color: rgba(0, 25, 38, 0.6);
            backdrop-filter: blur(12px);

        // --- RAPIER: 创建精准地形 Trimesh 碰撞 ---
        function createTrimeshBody(mesh, matrix) {
            mesh.updateMatrixWorld(true);
            const mat = matrix || mesh.matrixWorld;
            const geometry = mesh.geometry;
            const vertices =[];
            const indices =[];
            const v = new THREE.Vector3();

            if (geometry.index) {
                for (let i = 0; i < geometry.index.count; i++) indices.push(geometry.index.array[i]);
                for (let i = 0; i < geometry.attributes.position.count; i++) {
                    v.fromBufferAttribute(geometry.attributes.position, i);
                    v.applyMatrix4(mat); vertices.push(v.x, v.y, v.z);
                }
            } else {
                for (let i = 0; i < geometry.attributes.position.count; i++) {
                    v.fromBufferAttribute(geometry.attributes.position, i);
                    v.applyMatrix4(mat); vertices.push(v.x, v.y, v.z); indices.push(i);
                }
            }
            
            // 生成静止的刚体
            let rigidBodyDesc = RAPIER.RigidBodyDesc.fixed();
            let rigidBody = world.createRigidBody(rigidBodyDesc);
            
            // 完美支持任意网格与盒子的碰撞！
            let colliderDesc = RAPIER.ColliderDesc.trimesh(new Float32Array(vertices), new Uint32Array(indices));
            world.createCollider(colliderDesc, rigidBody);
            return rigidBody;
        }

        function getSafeMesh(gltfScene, targetScale = 1) {
            const group = new THREE.Group();
            gltfScene.traverse(child => {
                if (child.isMesh) {
                    const clonedMesh = new THREE.Mesh(child.geometry, child.material);
                    clonedMesh.scale.setScalar(targetScale); clonedMesh.rotation.set(Math.PI/2, 0, 0); 
                    clonedMesh.castShadow = true; clonedMesh.receiveShadow = true;
                    group.add(clonedMesh);
                }
            });
            return group;
        }

                });

                    spiralGroup.position.set(0, 4.3, 14.5); spiralGroup.rotation.set(0, Math.PI / 2 * 3, 0);
