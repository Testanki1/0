                    spiralGroup.add(new THREE.Mesh(helixGeom, matFront));
                    spiralGroup.add(new THREE.Mesh(helixGeom, matBack));
                    scene.add(spiralGroup);
                }
            }

            let r_angle = 0; let o_counter = 0;
            const checkpoints =[1, 18, 35, 52, 69, 86, 103];

            // --- 新增：向后推算并生成 -1 和 -2 的隐形引力节点 ---
            let backNodes = [];
            let curr_angle = 0;
            for (let e = -1; e >= -2; e--) {
                // 确保根号下不为负数避免 NaN
                let a = Math.max(1, 0.8 * Math.sqrt(Math.max(0, e + 1.6)));
                const x = -a * Math.cos(curr_angle) * 5.7;
                const y = -a * Math.sin(curr_angle) * 5.7 + 3.5;
                const z = 14 * -a + 15.8 + 0.3 * curr_angle;
                
                // typeStr: null 确保不会生成实际的车站模型，仅提供引力
                backNodes.unshift({ x, y, z, m: e, radius: a, theta: curr_angle, typeStr: null });
                curr_angle -= Math.asin(1 / a);
            }
            trackNodes.push(...backNodes); // 将负数节点放入数组头部

            // --- 原始的正向生成循环 ---
            for (let e = 0; e <= 123; e++) { 
                const a = Math.max(1, 0.8 * Math.sqrt(e + 1.6));
                r_angle += 1 * Math.asin(1 / a);
                const x = -a * Math.cos(r_angle) * 5.7;
                const y = -a * Math.sin(r_angle) * 5.7 + 3.5;
                const z = 14 * -a + 15.8 + 0.3 * r_angle;

                if (o_counter === 4) o_counter = 0; o_counter++;
                let typeNum = checkpoints.includes(e) ? (e === 103 ? 6 : 5) : o_counter;
                let typeStr = 'station1';
                
                if (typeNum >= 1 && typeNum <= 4) typeStr = 'station' + typeNum;
                if (typeNum === 5) typeStr = 'checkpoint';
                if (typeNum === 6) typeStr = 'finish'; // e=103 仍是终点
                
                // ★ 新增：超过 103 的部分不渲染物理轨道模型，仅在后台提供引力引导
                if (e > 103) typeStr = null; 
                
                trackNodes.push({ x, y, z, m: e, radius: a, theta: r_angle, typeStr });
            }

            trackNodes.forEach(node => {
                if (!node.typeStr) return; 

                let scale = 100;
                if (node.typeStr === 'station1') scale = 75.67;
                if (node.typeStr === 'station4') scale = 55.6;

                const meshGroup = getSafeMesh(loadedModels[node.typeStr], scale);
                
                let rotY = 0;
                if (node.typeStr.startsWith('station') && node.typeStr !== 'station4') {
                    rotY = 2 * -Math.PI * node.m / node.radius * 103;
                } else if (node.typeStr === 'station4' || node.typeStr === 'checkpoint') {
                    const d = Math.sin(node.theta) < 0 ? Math.sin(node.theta) : Math.sin(node.theta) + Math.PI;
                    rotY = node.typeStr === 'station4' ? Math.PI + d : d;
                } else if (node.typeStr === 'finish') {
                    rotY = 2 * -Math.PI * node.m / node.radius * 90;
                }
                
                meshGroup.position.set(node.x, node.y, node.z);
                if(node.typeStr === 'station3') meshGroup.position.y -= 0.1;
                if(node.typeStr === 'checkpoint') { meshGroup.position.x += 0.1; meshGroup.position.y += 0.2; meshGroup.position.z += 0.1; }
                meshGroup.rotation.y = rotY;
                scene.add(meshGroup);

                meshGroup.updateMatrixWorld(true);
                meshGroup.children.forEach(child => {
                    createTrimeshBody(child, child.matrixWorld); // 交给 Rapier 初始化地形
                    collidableMeshes.push(child);
                });
            });

            window.asteroidsArr =[]; let ast_o = 0;
            for (let e = 1; e <= 120; e++) { 
                const t_val = Math.max(1, 0.8 * Math.sqrt(e + 1.6));
                ast_o += 2 * Math.asin(1 / t_val);
                const x = t_val * Math.cos(ast_o) * 5.7; 
                const y = t_val * Math.sin(ast_o) * 5.7 + 3.5; 
                const z = 14 * -t_val + 15.8 + 0.3 * ast_o;
                const type = Math.random() > 0.5 ? 'asteroid1' : 'asteroid2';
                
                const scale = 2 * Math.random() + 1;
                const astGroup = getSafeMesh(loadedModels[type], scale); 
                astGroup.position.set(x, y, z); 
                astGroup.rotation.set(0, 89 * -Math.PI / e, 0); 
                scene.add(astGroup);
                
                // --- 新增：提取精确顶点，创建物理凸包碰撞体 ---
                const vertices =[];
                astGroup.children.forEach(child => {
                    if (child.isMesh) {
                        child.updateMatrix(); // 更新局部矩阵以包含缩放和初始旋转
                        const pos = child.geometry.attributes.position;
                        const v = new THREE.Vector3();
                        for (let i = 0; i < pos.count; i++) {
                            v.fromBufferAttribute(pos, i);
                            v.applyMatrix4(child.matrix); // 转为相对于陨石中心的局部坐标
                            vertices.push(v.x, v.y, v.z);
                        }
                    }
                });
                
                // 生成凸包碰撞体 (如果模型极其特殊导致失败，则降级为球体)
                let colliderDesc = RAPIER.ColliderDesc.convexHull(new Float32Array(vertices));
                if (!colliderDesc) colliderDesc = RAPIER.ColliderDesc.ball(scale);

                // 创建"运动学刚体"(KinematicPositionBased)，专门用于代码控制轨迹的物理物体
                const rigidBodyDesc = RAPIER.RigidBodyDesc.kinematicPositionBased()
                    .setTranslation(x, y, z)
                    .setRotation(astGroup.quaternion);
                const body = world.createRigidBody(rigidBodyDesc);
                world.createCollider(colliderDesc, body);
                
                // 将物理 body 也存入数组，方便在动画循环中更新
                window.asteroidsArr.push({ 
                    mesh: astGroup, 
                    body: body, 
                    speedX: 0.001 + 0.0001 * e, 
                    initialY: y, 
                    floatOffset: Math.random() * Math.PI * 2 
                });
            }

            const tankGroup = getSafeMesh(loadedModels.tank, 100);
            const visualWrapper = new THREE.Group();
            visualWrapper.rotation.y = Math.PI / 2; 
            while(tankGroup.children.length > 0) { visualWrapper.add(tankGroup.children[0]); }
            tankGroup.add(visualWrapper);
            scene.add(tankGroup);
            tankMesh = tankGroup;

            // 找到真正的 0 号节点作为出生点，防止出生在 -2 的位置
            const startNode = trackNodes.find(n => n.m === 0) || trackNodes[0];
            
            // --- RAPIER: 创建 Box(方盒子) 坦克，真正支持平移且永不翻车 ---
            const colliderDesc = RAPIER.ColliderDesc.roundCuboid(0.25, 0.10, 0.40, 0.05);
            const rigidBodyDesc = RAPIER.RigidBodyDesc.dynamic()
                .setTranslation(startNode.x, startNode.y + 5, startNode.z)
                .lockRotations() // 锁死物理旋转，再也不翻车！
                .setLinearDamping(0.0);
            
            tankBody = world.createRigidBody(rigidBodyDesc);
            world.createCollider(colliderDesc, tankBody);
            
            gameState.lastTankMapAngle = Math.atan2(startNode.x, startNode.z);
            gameState.lastScorePos.set(startNode.x, startNode.y + 5, startNode.z);
        };

        function checkScoring() {
            if (!tankBody || !gameState.isPlaying || gameState.isFinished || gameState.isRespawning) return;

            const tPos = tankBody.translation();
            const currentPos = new THREE.Vector3(tPos.x, tPos.y, tPos.z);
            let minIndex = -1; let minDistSq = Infinity;

            // ★ 修改：通过寻找真实编号 103 的节点作为计分终点
            const scoreEndIndex = trackNodes.findIndex(n => n.m === 103);
            for (let i = 0; i <= scoreEndIndex; i++) {
                const node = trackNodes[i];
                const distSq = currentPos.distanceToSquared(new THREE.Vector3(node.x, node.y, node.z));
                if (distSq < minDistSq) { minDistSq = distSq; minIndex = i; }
            }

            if (minDistSq > 4) return;
            
            // 获取匹配的节点，使用它自带的 m 属性来计算得分
            const matchedNode = trackNodes[minIndex];
            const targetScore = Math.min(GAME_CONFIG.maxScore, Math.max(0, matchedNode.m - 1));

            if (targetScore !== gameState.score) {
                const oldDisplayScore = Math.max(0, gameState.score); const scoreDiff = targetScore - oldDisplayScore;
                gameState.score = targetScore; const newDisplayScore = Math.max(0, gameState.score);
                updateScoreDisplay();
                
                const oldLap = Math.floor(oldDisplayScore / GAME_CONFIG.pointsPerLap) + 1;
                const newLap = Math.floor(newDisplayScore / GAME_CONFIG.pointsPerLap) + 1;
                
                if ((newLap > oldLap && newLap <= GAME_CONFIG.maxLaps) || newDisplayScore === GAME_CONFIG.maxScore) {
                    if (newLap <= GAME_CONFIG.maxLaps && newLap > oldLap) showLapEffect(newLap);
                }
                playSound('sfx-score-change');
if (scoreDiff > 0) { 
    showFloatingText("+" + scoreDiff, currentPos); // 绿色加分：直接显示 "+数字"
} else if (scoreDiff < 0) { 
    showFloatingText(scoreDiff.toString(), currentPos, true); // 红色扣分：直接显示带负号的数字
}
                // -----------------------------------------------------------------------------
            }
        }

        function updateJoystick(clientX, clientY) {
            const maxDist = 45; let dx = clientX - joystickOrigin.x; let dy = clientY - joystickOrigin.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if(dist > maxDist) { const ratio = maxDist / dist; dx *= ratio; dy *= ratio; }
            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

                document.getElementById('win-time').innerText = t.time + formatTime(finalTime);
                const currentBest = getBestTime();
                if (currentBest === null || finalTime < currentBest) { saveBestTime(finalTime); document.getElementById('win-time').innerText += ` (${t.newRecord})`; }
                document.getElementById('win-screen').classList.remove('hidden'); document.getElementById('ui-layer').classList.remove('pointer-events-none');
            }
        }

        function respawn(mode = 'full') {
            if(!tankBody || !trackNodes[0]) return;
            let savedScore = 0;
            if (gameState.score > 0 && gameState.score < GAME_CONFIG.maxScore) { savedScore = Math.floor(gameState.score / GAME_CONFIG.pointsPerLap) * GAME_CONFIG.pointsPerLap; } else if (gameState.score < 0) { savedScore = 0; }
            const targetM = savedScore === 0 ? 0 : savedScore + 1;
            const targetNode = trackNodes.find(n => n.m === targetM) || trackNodes[0];

            // RAPIER 强行设定坐标和速度
            tankBody.setTranslation({x: targetNode.x, y: targetNode.y + 5, z: targetNode.z}, true);
            tankBody.setLinvel({x: 0, y: 0, z: 0}, true);
            tankBody.setAngvel({x: 0, y: 0, z: 0}, true);
            
            if(tankMesh) tankMesh.rotation.set(0, 0, 0); 
            if (mode === 'full') { gameState.isRespawning = false; if(tankMesh) tankMesh.visible = true; }
            gameState.lastScorePos.set(targetNode.x, targetNode.y + 5, targetNode.z);
            if (gameState.score > 0 && gameState.score < GAME_CONFIG.maxScore) { gameState.score = Math.floor(gameState.score / GAME_CONFIG.pointsPerLap) * GAME_CONFIG.pointsPerLap; } else if (gameState.score < 0) { gameState.score = 0; }
            gameState.lastTankMapAngle = 0; updateScoreDisplay();

            if (mode === 'silent') return;
            const restartTarget = new THREE.Vector3(targetNode.x, targetNode.y, targetNode.z);
            camera.position.set(restartTarget.x - 1, restartTarget.y + 1.2, restartTarget.z + 2.0);
            controls.target.copy(restartTarget); smoothedCameraTarget.copy(restartTarget);
            cameraInitialized = false; controls.update();
        }

        function triggerRespawn() {
            if (gameState.isRespawning) return;
            gameState.isRespawning = true; gameState.respawnStartTime = clock.getElapsedTime();
            // 原先这里的 const jumpSound = ... 这一行整行被删除
            gameState.isRespawning = true; gameState.respawnStartTime = clock.getElapsedTime();
            gameState.respawnStartPos.copy(camera.position); gameState.respawnStartTarget.copy(controls.target);

            let savedScore = 0;
            if (gameState.score > 0 && gameState.score < GAME_CONFIG.maxScore) { savedScore = Math.floor(gameState.score / GAME_CONFIG.pointsPerLap) * GAME_CONFIG.pointsPerLap; }
            const targetM = savedScore === 0 ? 0 : savedScore + 1;
            const targetNode = trackNodes.find(n => n.m === targetM) || trackNodes[0];

            gameState.respawnEndTarget.set(targetNode.x, targetNode.y, targetNode.z);
            const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
            gameState.respawnEndPos.set(gameState.respawnEndTarget.x - Math.sqrt(offset.x*offset.x + offset.z*offset.z), gameState.respawnEndTarget.y + offset.y, gameState.respawnEndTarget.z);

            respawn('silent');
            if(tankMesh) { tankMesh.visible = false; tankMesh.position.set(0, -10000, 0); }
        }

        function easeInOutCubic(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
        const smoothedCameraTarget = new THREE.Vector3(); let cameraInitialized = false;

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05); const now = clock.getElapsedTime();

            if (beamNoiseTex) beamNoiseTex.offset.y += 0.5 * dt;
            if (skyboxMesh) skyboxMesh.rotation.y += 0.0005;
            if(window.asteroidsArr) {
                window.asteroidsArr.forEach(ast => {
                    // 1. 更新视觉模型的旋转和浮动位置
                    ast.mesh.rotation.x += ast.speedX; 
                    ast.mesh.position.y = ast.initialY + Math.sin(now * 0.5 + ast.floatOffset) * 1.5;
                    
                    // 2. 新增：将下一帧的精确位置与旋转，强制同步给物理引擎！
                    if (ast.body) {
                        ast.body.setNextKinematicTranslation(ast.mesh.position);
                        ast.body.setNextKinematicRotation(ast.mesh.quaternion);
                    }
                });
            }
            
            if (gameState.isPlaying && !gameState.isFinished && !document.hidden) {
                gameState.elapsedTime = now - gameState.gameStartTime; document.getElementById('game-timer').innerText = formatTime(gameState.elapsedTime);
            }
            
            if (gameState.isRespawning) {
                const elapsed = now - gameState.respawnStartTime; let t = elapsed / gameState.respawnDuration;
                if (t >= 1.0) {
                    t = 1.0; gameState.isRespawning = false; camera.position.copy(gameState.respawnEndPos); controls.target.copy(gameState.respawnEndTarget);
                    smoothedCameraTarget.copy(gameState.respawnEndTarget); if(tankMesh) tankMesh.visible = true; 
                } else {
                    t = easeInOutCubic(t); camera.position.lerpVectors(gameState.respawnStartPos, gameState.respawnEndPos, t);
                    controls.target.lerpVectors(gameState.respawnStartTarget, gameState.respawnEndTarget, t);
                }
                controls.update(); renderer.render(scene, camera); return; 
            }

            if(gameState.isPlaying && tankBody && tankMesh) {
                // RAPIER: 获取方盒子的绝对中心坐标
                const tPos = tankBody.translation();
                const tankCenter = new THREE.Vector3(tPos.x, tPos.y, tPos.z);
                
                // 视觉对齐：盒子高度是 0.6，向下平移半尺寸 0.3 即紧贴地面！
                tankMesh.position.set(tPos.x, tPos.y - 0.15, tPos.z);

                let closestDistSq = Infinity;
                let trackForwardDir = new THREE.Vector3(); 
                let trackCenterDir = new THREE.Vector3();  

                for (let i = 0; i < trackNodes.length - 1; i++) {
                    // 数学轨道抬高 0.15 半尺寸，完美吸附新方盒子中心点
const p1 = new THREE.Vector3(trackNodes[i].x, trackNodes[i].y + 0.15, trackNodes[i].z);
const p2 = new THREE.Vector3(trackNodes[i+1].x, trackNodes[i+1].y + 0.15, trackNodes[i+1].z);

                    const line = new THREE.Vector3().subVectors(p2, p1);
                    const lenSq = line.lengthSq();
                    const p1ToTank = new THREE.Vector3().subVectors(tankCenter, p1);
                    
                    const t = Math.max(0, Math.min(1, p1ToTank.dot(line) / lenSq));
                    const closestPoint = new THREE.Vector3().copy(p1).add(line.clone().multiplyScalar(t));

                    const distSq = closestPoint.distanceToSquared(tankCenter);
                    if (distSq < closestDistSq) {
                        closestDistSq = distSq; trackForwardDir.copy(line).normalize(); 
                        trackCenterDir.subVectors(closestPoint, tankCenter); gameState.currentTrackIndex = i;
                    }
                }

                const isInGravityWave = (closestDistSq < 100); 

                // --- 物理引擎推进！ ---
                world.timestep = dt;
                world.step();
                checkScoring(); 
                
                const currentMapAngle = Math.atan2(tankMesh.position.x, tankMesh.position.z);
                gameState.lastTankMapAngle = currentMapAngle;

                const usingJoystick = (Math.abs(input.joyX) > 0.01 || Math.abs(input.joyY) > 0.01);
                let targetVel = new THREE.Vector3(0,0,0);
                let isMoving = false;

                if (usingJoystick) {
                    const camDir = new THREE.Vector3(); camera.getWorldDirection(camDir); camDir.y = 0; camDir.normalize();
                    const camRight = new THREE.Vector3(-camDir.z, 0, camDir.x);
                    const moveVec = new THREE.Vector3(); moveVec.addScaledVector(camDir, -input.joyY); moveVec.addScaledVector(camRight, input.joyX);
                    if(moveVec.length() > 0.1) {
                        isMoving = true; moveVec.normalize(); targetVel.copy(moveVec).multiplyScalar(PHYSICS.moveSpeed);
                        const targetAngle = Math.atan2(targetVel.x, targetVel.z) - Math.PI / 2; let curRot = tankMesh.rotation.y;
                        let diff = targetAngle - curRot; while(diff > Math.PI) diff -= Math.PI*2; while(diff < -Math.PI) diff += Math.PI*2;
                        tankMesh.rotation.y += Math.max(-PHYSICS.turnSpeed * dt, Math.min(PHYSICS.turnSpeed * dt, diff));
                    }
                } else {
                    if(input.keyTurn !== 0) tankMesh.rotation.y += input.keyTurn * PHYSICS.tankTurnSpeed * dt;
                    if(input.keyForward !== 0) {
                        isMoving = true; const forwardDir = new THREE.Vector3(1, 0, 0); forwardDir.applyEuler(tankMesh.rotation);
                        targetVel.copy(forwardDir).multiplyScalar(input.keyForward * PHYSICS.moveSpeed);
                    }
                }
                
                // 读取 Rapier 最新速度以便修改
                let rVel = tankBody.linvel();
                let vX = rVel.x, vY = rVel.y, vZ = rVel.z;

                if (input.fly) {
                    isMoving = true; const forwardDir = new THREE.Vector3(1, 0, 0); forwardDir.applyEuler(tankMesh.rotation);
                    targetVel.copy(forwardDir).multiplyScalar(PHYSICS.flySpeed);
                    
                    vY += (PHYSICS.flyLift - vY) * 6 * dt;
                    const currentVel = new THREE.Vector3(vX, 0, vZ);
                    currentVel.lerp(targetVel, PHYSICS.acceleration * dt);
                    vX = currentVel.x; vZ = currentVel.z;
                    if (!isFlying) { isFlying = true; } // 原先的 playSound('sfx-jump'); 被删掉了
                } else {
                    if (isFlying) isFlying = false;
                    if (isInGravityWave) {
                        const flowVel = trackForwardDir.clone().multiplyScalar(2.0); 
                        let gravityPull = new THREE.Vector3();
                        const distToCenter = trackCenterDir.length();
                        if (distToCenter > 0.01) {
                            const pullSpeed = Math.min(distToCenter * 2.5, 6.0);
                            gravityPull.copy(trackCenterDir).normalize().multiplyScalar(pullSpeed);
                        }
                        const finalVel = new THREE.Vector3().addVectors(flowVel, gravityPull).add(targetVel);

                        vX += (finalVel.x - vX) * 4 * dt;
                        vY += (finalVel.y - vY) * 4 * dt; 
                        vZ += (finalVel.z - vZ) * 4 * dt;
                    } else {
                        const currentVel = new THREE.Vector3(vX, 0, vZ);
                        if(isMoving) currentVel.lerp(targetVel, PHYSICS.acceleration * dt); else currentVel.lerp(new THREE.Vector3(0,0,0), PHYSICS.deceleration * dt);
                        vX = currentVel.x; vZ = currentVel.z; vY *= 0.98; 
                    }
                }
                
                // 把修改后的速度写回 Rapier！
                tankBody.setLinvel({x: vX, y: vY, z: vZ}, true);

                if(closestDistSq > 2500 && !gameState.isRespawning) triggerRespawn();

                if(!cameraInitialized) { smoothedCameraTarget.copy(tankMesh.position); cameraInitialized = true; }
                const camLerpSpeed = 5.0; smoothedCameraTarget.lerp(tankMesh.position, camLerpSpeed * dt);
                const targetDelta = new THREE.Vector3().subVectors(smoothedCameraTarget, controls.target);
                camera.position.add(targetDelta); controls.target.add(targetDelta); controls.update();
            } else if ((!gameState.isPlaying || gameState.isFinished) && tankBody && tankMesh) {
                 const t = Date.now() * 0.0005; camera.position.x = Math.sin(t) * 150; camera.position.z = Math.cos(t) * 150; camera.position.y = 80; camera.lookAt(0, 0, 0);
            } else { controls.update(); }

            renderer.render(scene, camera);
        }

        function playSound(id) { const el = document.getElementById(id); if(el) { el.currentTime = 0; el.play().catch(()=>{}); } }
        
        const aboutBtn = document.getElementById('about-btn'); const soundBtn = document.getElementById('sound-btn');
        const closeAboutBtn = document.getElementById('close-about-btn'); const aboutModal = document.getElementById('about-modal');
        const startScreen = document.getElementById('start-screen'); const audioElements = document.querySelectorAll('audio');
        
        document.addEventListener('click', () => {
            if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().then(() => { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); }).catch(() => {});
            }
        });

        aboutBtn.addEventListener('click', () => { aboutModal.classList.remove('hidden'); });
        closeAboutBtn.addEventListener('click', () => { aboutModal.classList.add('hidden'); });

        function updateSoundState() {
            const icon = soundBtn.querySelector('.material-symbols-rounded');
            if (gameState.soundEnabled) {
                soundBtn.classList.add('active'); icon.innerText = 'volume_up';
                audioElements.forEach(el => { el.muted = false; if (el.id === 'bg-music' && gameState.isPlaying) el.play().catch(()=>{}); });
            } else {
                soundBtn.classList.remove('active'); icon.innerText = 'volume_off'; audioElements.forEach(el => el.muted = true);
            }
        }

        soundBtn.addEventListener('click', () => { gameState.soundEnabled = !gameState.soundEnabled; updateSoundState(); });
        gameState.soundEnabled = false; updateSoundState();

        const resetBtn = document.getElementById('reset-btn'); resetBtn.addEventListener('click', resetGameLogic);

        const startGame = () => {
            if(!gameState.assetsLoaded || gameState.isPlaying) return;
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
            if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
            if(window.matchMedia("(pointer: coarse)").matches) document.getElementById('touch-ui').style.display = 'block';

            gameState.isPlaying = true; gameState.gameStartTime = clock.getElapsedTime();
            startScreen.classList.add('opacity-0'); startScreen.classList.add('pointer-events-none');
            setTimeout(() => startScreen.classList.add('hidden'), 500);
            
            const bgMusic = document.getElementById('bg-music'); bgMusic.volume = 0.4; bgMusic.play().catch(()=>{});
            updateScoreDisplay(); respawn('full');
        };

        startBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
        startScreen.addEventListener('click', startGame);
        window.addEventListener('keydown', (e) => { if (!gameState.isPlaying && gameState.assetsLoaded && !startScreen.classList.contains('hidden')) startGame(); });

        const winScreen = document.getElementById('win-screen');
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if(mutation.target.classList.contains('hidden')) {
                   document.getElementById('ui-layer').classList.add('pointer-events-none'); document.querySelector('.header-row').classList.add('pointer-events-auto');
                } else { document.getElementById('ui-layer').classList.remove('pointer-events-none'); }
            });
        });
        observer.observe(winScreen, { attributes: true, attributeFilter:['class'] });

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        animate();
    <\/script>

</script>
<script>
(()=>{'use strict';const iframe=document.getElementById('game'), buttons=[...document.querySelectorAll('[data-mode]')], bases={map:'',cyber:'cybertank/',snow:'tanki-and-the-snow-trap/',space:'tanks-in-space/'};let current=null;
function switchMode(mode){if(!(mode in bases)||mode===current)return;current=mode;buttons.forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));let src=document.getElementById('source-'+mode).textContent.trimStart().replaceAll('<\\/script>','</scr'+'ipt>');let url=new URL(bases[mode],location.href).href.replaceAll('&','&amp;').replaceAll('"','&quot;');src=src.replace(/<head(\s[^>]*)?>/i,match=>match+'<base href="'+url+'">');iframe.srcdoc=src;}
iframe.addEventListener('load',()=>{try{const doc=iframe.contentDocument;if(!doc||!doc.body)return;const back=doc.createElement('button');back.textContent=current==='map'?'退出全屏 / 场景选择':'返回融合世界';back.setAttribute('aria-label',back.textContent);Object.assign(back.style,{position:'fixed',left:'50%',bottom:'8px',transform:'translateX(-50%)',zIndex:'2147483647',padding:'7px 11px',font:'600 12px system-ui,sans-serif',color:'#effff1',background:'rgba(8,25,35,.82)',border:'1px solid #b6efb47a',borderRadius:'8px',cursor:'pointer'});back.addEventListener('click',async e=>{e.preventDefault();e.stopPropagation();try{if(document.fullscreenElement)await document.exitFullscreen();else if(doc.fullscreenElement)await doc.exitFullscreen()}catch(e){}if(current!=='map')switchMode('map')});doc.body.appendChild(back)}catch(e){console.error('返回按钮加载失败',e)}});
buttons.forEach(b=>b.addEventListener('click',()=>switchMode(b.dataset.mode)));
window.addEventListener('message',e=>{if(e.source===iframe.contentWindow&&e.origin===location.origin&&e.data&&e.data.type==='tanki-native')switchMode(e.data.mode)});switchMode('map');})();
</script></body></html>
