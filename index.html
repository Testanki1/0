<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#001926" />
    <title>坦克四界 · 融合世界</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #001926;
        color: #e8f3fa;
        font-family:
          system-ui,
          -apple-system,
          "Microsoft YaHei",
          sans-serif;
        user-select: none;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      .ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .panel {
        pointer-events: auto;
        background: rgba(0, 25, 38, 0.82);
        border: 1px solid #ffffff25;
        box-shadow: 0 8px 30px #0005;
        border-radius: 17px;
        backdrop-filter: blur(12px);
      }
      .worlds {
        position: absolute;
        top: 14px;
        left: 14px;
        padding: 12px;
        max-width: calc(100vw - 255px);
      }
      .brand {
        font-weight: 900;
        font-size: 15px;
        margin-bottom: 8px;
      }
      .brand em {
        color: #adf9a1;
        font-style: normal;
      }
      .tabs {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        cursor: pointer;
        color: #e5f5f8;
        border: 1px solid #ffffff35;
        background: #ffffff12;
        border-radius: 8px;
        padding: 8px 11px;
        touch-action: manipulation;
      }
      button:hover {
        background: #ffffff22;
      }
      button.active {
        background: #b8f69d;
        color: #082313;
        border-color: #b8f69d;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .hud {
        position: absolute;
        top: 14px;
        right: 14px;
        padding: 14px;
        width: 225px;
      }
      .hud .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .muted {
        color: #a5b9c9;
        font-size: 12px;
      }
      .hud strong {
        font-size: 28px;
      }
      .hud small {
        color: #a6b8c7;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 9px;
      }
      .actions button {
        padding: 7px;
        font-size: 12px;
      }
      .hint {
        position: absolute;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        padding: 8px 12px;
        white-space: nowrap;
      }
      .toast {
        position: absolute;
        top: 28%;
        left: 50%;
        transform: translateX(-50%);
        font-size: 25px;
        font-weight: 900;
        color: #e2ffb0;
        text-shadow: 0 2px 12px #000;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .toast.show {
        opacity: 1;
      }
      .screen {
        position: absolute;
        inset: 0;
        background: #00121cdd;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
      }
      .screen.hidden,
      .hidden {
        display: none !important;
      }
      .dialog {
        width: min(90vw, 480px);
        padding: 28px;
        text-align: center;
      }
      .dialog h1 {
        font-size: 26px;
        margin: 0 0 8px;
      }
      .dialog p {
        color: #b8cbd6;
        line-height: 1.6;
      }
      .dialog button.primary {
        background: #aefa9f;
        color: #112612;
        font-weight: 800;
        padding: 12px 25px;
      }
      .meter {
        width: 100%;
        height: 8px;
        background: #ffffff20;
        border-radius: 8px;
        overflow: hidden;
      }
      .meter div {
        height: 100%;
        width: 0;
        background: #aefa9f;
      }
      .touch {
        display: none;
        pointer-events: none;
      }
      .stick {
        position: absolute;
        left: 28px;
        bottom: 28px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: #ffffff18;
        border: 1px solid #ffffff44;
        pointer-events: auto;
        touch-action: none;
      }
      .knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 50px;
        height: 50px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: #e8ffe1a0;
      }
      .jump {
        position: absolute;
        right: 28px;
        bottom: 28px;
        width: 82px;
        height: 82px;
        border-radius: 50%;
        font-size: 26px;
        pointer-events: auto;
        touch-action: none;
      }
      .scorepop {
        position: fixed;
        color: #adff9e;
        font-weight: 900;
        font-size: 23px;
        text-shadow: 0 2px 8px #000;
        pointer-events: none;
        animation: rise 1s forwards;
      }
      @keyframes rise {
        to {
          opacity: 0;
          transform: translateY(-60px);
        }
      }
      .menu-toggle {
        display: none;
      }
      @media (pointer: coarse) {
        .touch {
          display: block;
        }
        .hint {
          bottom: 4px;
        }
      }
      @media (max-width: 650px) {
        .brand,
        #zone-status {
          display: none;
        }
        .menu-toggle {
          display: inline-block;
          margin-top: 4px;
          padding: 4px 7px;
          font-size: 10px;
        }
        .hud .actions {
          display: none;
        }
        .hud.expanded .actions {
          display: flex;
        }
        .worlds {
          left: 6px;
          top: 6px;
          padding: 7px;
          max-width: calc(100vw - 147px);
        }
        .brand {
          font-size: 12px;
          margin-bottom: 4px;
        }
        .tabs button {
          padding: 5px;
          font-size: 11px;
        }
        .hud {
          right: 6px;
          top: 6px;
          width: 135px;
          padding: 8px;
        }
        .hud strong {
          font-size: 21px;
        }
        .actions button {
          padding: 5px;
          font-size: 10px;
        }
        .hint {
          font-size: 10px;
        }
        .stick {
          width: 90px;
          height: 90px;
          left: 15px;
          bottom: 20px;
        }
        .jump {
          width: 64px;
          height: 64px;
          right: 15px;
          bottom: 20px;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat/rapier.es.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="viewport"></div>
    <div class="ui">
      <div class="worlds panel">
        <div class="brand"><em>▰</em> 坦克四界 · 单一世界</div>
        <div class="tabs">
          <button data-zone="cyber">赛博</button
          ><button data-zone="snow">冰雪</button
          ><button data-zone="space">太空</button
          ><button data-zone="halloween">万圣节</button>
        </div>
        <div class="muted" id="zone-status" style="margin-top: 6px">准备中</div>
      </div>
      <div class="hud panel">
        <div class="row"><b id="lap">圈数 1 / 6</b><b id="timer">00:00</b></div>
        <div class="row">
          <strong id="score">0</strong
          ><span id="range" class="muted">0–17</span>
        </div>
        <div class="muted">
          最佳 <span id="best">—</span>
          <button id="delete-best" style="padding: 2px 6px; font-size: 10px">
            清除
          </button>
        </div>
        <button id="menu-toggle" class="menu-toggle">设置 ▾</button>
        <div class="actions">
          <button id="restart">重新开始</button
          ><button id="respawn">检查点</button
          ><button id="sound">声音：关</button
          ><button id="camera">自动镜头：开</button
          ><button id="about">说明</button><button id="fullscreen">全屏</button>
        </div>
      </div>
      <div id="hint" class="hint panel">
        WASD / 方向键移动 · 空格跳跃 · 拖动视角
      </div>
      <div id="toast" class="toast"></div>
      <div class="touch">
        <div id="stick" class="stick"><div id="knob" class="knob"></div></div>
        <button id="jump" class="jump">↑</button>
      </div>
      <div id="loading" class="screen">
        <div class="dialog panel">
          <h1 id="loading-title">正在加载场景</h1>
          <p id="loading-text">请稍候…</p>
          <div class="meter"><div id="loading-bar"></div></div>
        </div>
      </div>
      <div id="welcome" class="screen hidden">
        <div class="dialog panel">
          <h1 id="welcome-title">准备出发</h1>
          <p id="welcome-desc"></p>
          <button id="start" class="primary">开始挑战</button>
        </div>
      </div>
      <div id="win" class="screen hidden">
        <div class="dialog panel">
          <h1>挑战完成！</h1>
          <p id="win-text"></p>
          <button id="replay" class="primary">再来一次</button>
        </div>
      </div>
      <div id="help" class="screen hidden">
        <div class="dialog panel">
          <h1 id="help-title">操作说明</h1>
          <p id="help-text"></p>
          <button id="close-help" class="primary">继续</button>
        </div>
      </div>
    </div>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
      import { RGBELoader } from "three/addons/loaders/RGBELoader.js";
      import { EXRLoader } from "three/addons/loaders/EXRLoader.js";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import * as RAPIER from "@dimforge/rapier3d-compat";
      const $ = (id) => document.getElementById(id),
        v = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
      const zones = {
        cyber: {
          name: "赛博坦克",
          origin: v(1200, 0, 0),
          gravity: -9.81,
          camera: [8, 70, 28],
          movement: "cyber",
        },
        snow: {
          name: "坦克与雪之陷阱",
          origin: v(-1200, 0, 0),
          gravity: -60,
          camera: [10, 200, 55],
          movement: "snow",
        },
        space: {
          name: "太空中的坦克",
          origin: v(0, 0, 0),
          gravity: 0,
          camera: [1.5, 8, 6],
          movement: "space",
        },
        halloween: {
          name: "万圣节：甜蜜或捣蛋",
          origin: v(0, 0, 1200),
          gravity: -9.81,
          camera: [5, 55, 20],
          movement: "halloween",
        },
      };
      let zone = "cyber",
        player = null,
        loading = false,
        soundEnabled = false,
        autoCamera = true,
        spectator = false,
        running = false,
        lastFrame = performance.now(),
        score = 0,
        elapsed = 0,
        checkpoint = 0,
        best = null,
        scoreAnchor = null,
        jumpWasHeld = false,
        lastGrounded = -1e4,
        cameraPrevAngle = 0,
        spaceTrack = [],
        spaceAsteroids = [],
        beamTexture = null;
      const keyboard = { f: 0, t: 0, jump: false },
        joy = { x: 0, y: 0 };
      const states = {};
      let statusTimer;
      await RAPIER.init();
      const world = new RAPIER.World({ x: 0, y: -9.81, z: 0 });
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      $("viewport").appendChild(renderer.domElement);
      const scene = new THREE.Scene(),
        camera = new THREE.PerspectiveCamera(
          60,
          innerWidth / innerHeight,
          0.1,
          5000,
        ),
        controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enablePan = false;
      controls.minPolarAngle = 0.05;
      controls.maxPolarAngle = Math.PI / 2 - 0.05;
      const amb = new THREE.AmbientLight(0xffffff, 1);
      scene.add(amb);
      const light = new THREE.DirectionalLight(0xffdfb0, 1.5);
      light.position.set(50, 100, 50);
      light.castShadow = true;
      light.shadow.mapSize.set(4096, 4096);
      light.shadow.bias = -0.0001;
      light.shadow.normalBias = 0.05;
      light.shadow.camera.left = -300;
      light.shadow.camera.right = 300;
      light.shadow.camera.top = 300;
      light.shadow.camera.bottom = -300;
      light.shadow.camera.far = 1000;
      scene.add(light);
      const routeMarker = new THREE.Group();
      const routeRing = new THREE.Mesh(
        new THREE.TorusGeometry(1, 0.06, 10, 48),
        new THREE.MeshBasicMaterial({ color: 0xb7ff92 }),
      );
      routeRing.rotation.x = Math.PI / 2;
      routeMarker.add(routeRing);
      const routeBeam = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08, 0.15, 3, 12),
        new THREE.MeshBasicMaterial({
          color: 0xcaffab,
          transparent: true,
          opacity: 0.7,
        }),
      );
      routeBeam.position.y = 1.5;
      routeMarker.add(routeBeam);
      routeMarker.visible = false;
      scene.add(routeMarker);
      const draco = new DRACOLoader();
      draco.setDecoderPath(
        "https://www.gstatic.com/draco/versioned/decoders/1.5.5/",
      );
      const loader = new GLTFLoader();
      loader.setDRACOLoader(draco);
      const textureLoader = new THREE.TextureLoader(),
        hdrLoader = new RGBELoader(),
        exrLoader = new EXRLoader();
      const loadGLB = (url) => loader.loadAsync(url),
        loadTexture = (url) => textureLoader.loadAsync(url),
        cdn = "https://web-cdn.tankionline.com/";
      const soundPaths = {
        cyber: {
          music: "cybertank/assets/bounce tanki loop cut (no intro).opus",
        },
        snow: {
          music: "tanki-and-the-snow-trap/static/media/main.a5574efb.mp3",
          score: "tanki-and-the-snow-trap/static/media/move.046bd221.mp3",
          lap: "tanki-and-the-snow-trap/static/media/checkpoint.d152b838.mp3",
          jump: "tanki-and-the-snow-trap/static/media/roll.0da23fa7.mp3",
        },
        space: {
          music: cdn + "darkmatter/main.mp3",
          score: "tanks-in-space/static/media/move.fcdf39d2.mp3",
        },
        halloween: {
          music: "https://pages.tankionline.com/audio/halloween/thm_3.mp3",
          score: "https://pages.tankionline.com/audio/halloween/move.mp3",
        },
      };
      let music = new Audio();
      music.loop = true;
      music.volume = 0.4;
      function switchMusic() {
        music.pause();
        music = new Audio(soundPaths[zone].music);
        music.loop = true;
        music.volume = 0.4;
        if (soundEnabled && running) music.play().catch(() => {});
      }
      function playSound(key) {
        const path = soundPaths[zone][key];
        if (!soundEnabled || !path) return;
        const a = new Audio(path);
        a.volume = 0.65;
        a.play().catch(() => {});
      }
      function toast(txt) {
        $("toast").textContent = txt;
        $("toast").classList.add("show");
        clearTimeout(statusTimer);
        statusTimer = setTimeout(
          () => $("toast").classList.remove("show"),
          1600,
        );
      }
      function progress(current, total) {
        $("loading-text").textContent = `加载资源 ${current} / ${total}`;
        $("loading-bar").style.width = (100 * current) / total + "%";
      }
      function colliderMesh(mesh) {
        mesh.updateWorldMatrix(true, false);
        const g = mesh.geometry,
          p = g?.attributes?.position;
        if (!p || mesh.isSkinnedMesh) return;
        const arr = new Float32Array(p.count * 3),
          q = v();
        for (let i = 0; i < p.count; i++) {
          q.fromBufferAttribute(p, i).applyMatrix4(mesh.matrixWorld);
          arr[i * 3] = q.x;
          arr[i * 3 + 1] = q.y;
          arr[i * 3 + 2] = q.z;
        }
        const idx = g.index
          ? Uint32Array.from(g.index.array)
          : Uint32Array.from({ length: p.count }, (_, i) => i);
        const body = world.createRigidBody(RAPIER.RigidBodyDesc.fixed());
        world.createCollider(
          RAPIER.ColliderDesc.trimesh(arr, idx).setFriction(0.001),
          body,
        );
      }
      function addTerrain(group) {
        group.updateWorldMatrix(true, true);
        group.traverse((o) => {
          if (o.isMesh && !o.isSkinnedMesh) {
            o.castShadow = true;
            o.receiveShadow = true;
            colliderMesh(o);
          }
        });
      }
      function safeMesh(gltfScene, scale = 1) {
        const g = new THREE.Group();
        gltfScene.traverse((o) => {
          if (o.isMesh) {
            const m = new THREE.Mesh(o.geometry, o.material);
            m.scale.setScalar(scale);
            m.rotation.x = Math.PI / 2;
            m.castShadow = true;
            m.receiveShadow = true;
            g.add(m);
          }
        });
        return g;
      }
      function textureSky(t) {
        t.colorSpace = THREE.SRGBColorSpace;
        t.mapping = THREE.EquirectangularReflectionMapping;
        return t;
      }
      function makePlayer(id, mesh, spawn, shape) {
        mesh.visible = false;
        scene.add(mesh);
        const descriptor = RAPIER.RigidBodyDesc.dynamic()
          .setTranslation(spawn.x, spawn.y, spawn.z)
          .setLinearDamping(id === "cyber" ? 0.5 : 0);
        if (id !== "cyber") descriptor.lockRotations();
        else descriptor.setAngularDamping(0.8).setCanSleep(false);
        const rigid = world.createRigidBody(descriptor);
        world.createCollider(shape, rigid);
        rigid.setEnabled(false);
        zones[id].player = { mesh, rigid, spawn: spawn.clone(), yaw: 0 };
        return zones[id].player;
      }
      async function loadCyber() {
        const z = zones.cyber,
          [field, tank, env] = await Promise.all([
            loadGLB("cybertank/assets/Minigame_Synth_Scene.glb"),
            loadGLB("cybertank/assets/Minigame_Synth_Tank.glb"),
            exrLoader.loadAsync(
              "cybertank/assets/Minigame_Synth_Environment_4096x2048.exr",
            ),
          ]);
        env.mapping = THREE.EquirectangularReflectionMapping;
        z.bg = env;
        z.env = env;
        const group = new THREE.Group();
        group.position.copy(z.origin);
        group.add(field.scene);
        z.group = group;
        scene.add(group);
        addTerrain(group);
        const verts = [];
        tank.scene.traverse((o) => {
          if (o.isMesh) {
            const p = o.geometry.attributes.position;
            for (let i = 0; i < p.count; i++)
              verts.push(p.getX(i), p.getY(i), p.getZ(i));
            o.castShadow = true;
          }
        });
        const collider =
          RAPIER.ColliderDesc.convexHull(new Float32Array(verts)) ||
          RAPIER.ColliderDesc.roundCuboid(2, 1, 3, 0.1);
        makePlayer(
          "cyber",
          tank.scene,
          z.origin.clone().add(v(0, 8, 0)),
          collider,
        );
        z.nodes = [
          [0, 0, 0],
          [0, 0, 35],
          [0, -15, 90],
          [30, -15, 120],
          [97.5, 0, 120],
          [165, -15, 120],
          [195, -15, 75],
          [165, -15, 30],
          [135, -15, 0],
          [135, 0, -60],
          [75, 0, -135],
          [105, 0, -180],
          [165, 15, -180],
          [195, 15, -135],
          [150, 15, -90],
          [105, 15, -60],
          [67.5, 15, -30],
        ].map((a) => z.origin.clone().add(v(...a)));
      }
      async function loadSnow() {
        const z = zones.snow,
          [islands, tank, sky, lightmap, hdr] = await Promise.all([
            loadGLB(cdn + "new-year/models/islands/islands.glb"),
            loadGLB(cdn + "new-year/models/tank/tank.glb"),
            loadTexture(cdn + "new-year/sky.png"),
            loadTexture(cdn + "new-year/models/islands/lightmap.png"),
            hdrLoader.loadAsync(cdn + "new-year/forest.hdr"),
          ]);
        z.bg = textureSky(sky);
        hdr.mapping = THREE.EquirectangularReflectionMapping;
        z.env = hdr;
        lightmap.flipY = false;
        lightmap.colorSpace = THREE.SRGBColorSpace;
        const group = new THREE.Group();
        group.position.copy(z.origin);
        group.add(islands.scene);
        z.group = group;
        islands.scene.traverse((o) => {
          if (o.isMesh && o.material) {
            o.material.lightMap = lightmap;
            o.material.lightMapIntensity = 1;
          }
        });
        scene.add(group);
        addTerrain(group);
        tank.scene.traverse((o) => {
          if (o.isMesh) {
            o.castShadow = true;
            o.receiveShadow = true;
          }
        });
        makePlayer(
          "snow",
          tank.scene,
          z.origin.clone().add(v(0, 15, 167)),
          RAPIER.ColliderDesc.ball(1.5).setMass(30).setFriction(0.001),
        );
      }
      async function loadSpace() {
        const z = zones.space,
          base = cdn + "darkmatter/station/minify/",
          names = [
            "station1",
            "station2",
            "station3",
            "station4",
            "checkpoint",
            "finish",
            "paladin",
          ],
          results = await Promise.all([
            ...names.map((n) => loadGLB(base + n + "-transformed.glb")),
            loadGLB(cdn + "darkmatter/asteroids/asteroid1.glb"),
            loadGLB(cdn + "darkmatter/asteroids/asteroid2.glb"),
            loadGLB("tanks-in-space/spiral6.glb"),
            loadTexture("tanks-in-space/beam_noise.png"),
            loadTexture(cdn + "darkmatter/sky2.webp"),

        } else if (closest < 100) {
          let pull = v();
          const d = toward.length();
          if (d > 0.01)
            pull
              .copy(toward)
              .normalize()
              .multiplyScalar(Math.min(d * 2.5, 6));
          const final = forward.multiplyScalar(2).add(pull).add(target),
            factor = Math.min(1, 4 * dt);
          vx += (final.x - vx) * factor;
          vy += (final.y - vy) * factor;
          vz += (final.z - vz) * factor;
        } else {
          const h = v(vx, 0, vz).lerp(
            moving ? target : v(),
            Math.min(1, (moving ? 6 : 4) * dt),
          );
          vx = h.x;
          vz = h.z;
          vy *= 0.98;
        }
        player.rigid.setLinvel({ x: vx, y: vy, z: vz }, true);
        if (closest > 2500) respawn(true);
      }
      function groundMotion(dt, p, grounded, now) {
        let vel = player.rigid.linvel(),
          target = v(),
          moving = false;
        if (zone === "cyber") {
          const cf = v();
          camera.getWorldDirection(cf);
          cf.y = 0;
          cf.normalize();
          let right = v().crossVectors(cf, v(0, 1, 0));
          target
            .addScaledVector(cf, -joy.y || keyboard.f)
            .addScaledVector(right, joy.x || -keyboard.t);
          if (target.lengthSq() > 0.01) {
            moving = true;
            target.normalize().multiplyScalar(25);
            player.yaw = Math.atan2(target.x, target.z);
          }
        } else if (Math.abs(joy.x) > 0.01 || Math.abs(joy.y) > 0.01) {
          let cd = v();
          camera.getWorldDirection(cd);
          cd.y = 0;
          cd.normalize();
          const right = v(-cd.z, 0, cd.x);
          target = cd.multiplyScalar(-joy.y).addScaledVector(right, joy.x);
          if (target.length() > 0.1) {
            moving = true;
            target.normalize().multiplyScalar(zone === "snow" ? 55 : 8);
            const t = Math.atan2(target.x, target.z) - Math.PI / 2;
            let d = t - player.yaw;
            while (d > Math.PI) d -= 2 * Math.PI;
            while (d < -Math.PI) d += 2 * Math.PI;
            player.yaw += Math.max(-6 * dt, Math.min(6 * dt, d));
          }
        } else {
          player.yaw += keyboard.t * 2 * dt;
          if (keyboard.f) {
            moving = true;
            target
              .set(1, 0, 0)
              .applyAxisAngle(v(0, 1, 0), player.yaw)
              .multiplyScalar(keyboard.f * (zone === "snow" ? 55 : 8));
          }
        }
        const k =
            zone === "cyber"
              ? moving
                ? 1
                : 0.1
              : Math.min(1, (moving ? 3 : 1) * dt),
          horizontal = v(vel.x, 0, vel.z).lerp(moving ? target : v(), k);
        if (grounded) lastGrounded = now;
        let y = vel.y;
        if (
          keyboard.jump &&
          !jumpWasHeld &&
          now - lastGrounded < (zone === "snow" ? 0.2 : 0.1)
        ) {
          y = zone === "snow" ? 60 : zone === "cyber" ? 29 : 7;
          playSound("jump");
          lastGrounded = -1e4;
        }
        if (zone === "snow" && !keyboard.jump && jumpWasHeld && y > 0) y *= 0.5;
        jumpWasHeld = keyboard.jump;
        player.rigid.setLinvel({ x: horizontal.x, y, z: horizontal.z }, true);
        if (p.y < -120) respawn(true);
      }
      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const wall = performance.now(),
          actualDelta = Math.max(0, (wall - lastFrame) / 1000);
        lastFrame = wall;
        const dt = Math.min(clock.getDelta(), 0.05),
          now = clock.elapsedTime;
        if (beamTexture && zone === "space") beamTexture.offset.y += 0.5 * dt;
        if (zone === "halloween" && zones.halloween.mixer)
          zones.halloween.mixer.update(dt);
        if (zone === "space")
          for (const a of spaceAsteroids) {
            a.mesh.rotation.x += a.speed;
            a.mesh.position.y = a.y + Math.sin(now * 0.5 + a.phase) * 1.5;
            a.body.setNextKinematicTranslation(a.mesh.position);
            a.body.setNextKinematicRotation(a.mesh.quaternion);
          }
        if (player) {
          world.timestep = dt || 1 / 60;
          if (running) world.step();
          let position = player.rigid.translation(),
            p = v(position.x, position.y, position.z),
            grounded = groundCheck();
          if (running) {
            elapsed += actualDelta;
            if (zone === "space") spaceMotion(dt, p);
            else if (!(zone === "cyber" && spectator))
              groundMotion(dt, p, grounded, now);
            scoreUpdate(p, grounded);
          }
          player.mesh.position.copy(p);
          if (zone === "snow") player.mesh.position.y -= 1.5;
          if (zone === "space") player.mesh.position.y -= 0.15;
          player.mesh.rotation.y = player.yaw;
          if (zone === "cyber")
            player.rigid.setRotation(
              {
                x: 0,
                y: Math.sin(player.yaw / 2),
                z: 0,
                w: Math.cos(player.yaw / 2),
              },
              true,
            );
          routeMarker.visible =
            running &&
            (zone === "cyber" || zone === "halloween") &&
            score < 102;
          if (routeMarker.visible) {
            const n = zones[zone].nodes[(score + 1) % 17];
            routeMarker.position
              .copy(n)
              .add(v(0, zone === "cyber" ? 5 : 1.3, 0));
            routeMarker.scale.setScalar(zone === "cyber" ? 7 : 1.3);
          }
          if (zone === "snow" && autoCamera) {
            let angle = Math.atan2(
                p.x - zones.snow.origin.x,
                p.z - zones.snow.origin.z,
              ),
              d = angle - cameraPrevAngle;
            while (d > Math.PI) d -= 2 * Math.PI;
            while (d < -Math.PI) d += 2 * Math.PI;
            cameraPrevAngle = angle;
            const offset = camera.position
              .clone()
              .sub(controls.target)
              .applyAxisAngle(v(0, 1, 0), d);
            camera.position.copy(controls.target).add(offset);
          }
          if (!(zone === "cyber" && spectator)) {
            const offset = camera.position.clone().sub(controls.target);
            controls.target.lerp(
              p,
              Math.min(1, (zone === "snow" ? 3 : 5) * dt),
            );
            camera.position.copy(controls.target).add(offset);
          }
          controls.update();
          updateHUD();
        }
        renderer.render(scene, camera);
      }
      $("start").onclick = () => {
        if (score >= 102) {
          resetRace();
          return;
        }
        running = true;
        $("welcome").classList.add("hidden");
        if (soundEnabled) music.play().catch(() => {});
        updateHUD();
      };
      $("replay").onclick = resetRace;
      $("restart").onclick = () => {
        if (confirm("确定重新开始当前场景？")) resetRace();
      };
      $("respawn").onclick = () => respawn(true);
      $("delete-best").onclick = () => {
        if (confirm("删除此场景的最佳成绩？")) {
          try {
            localStorage.removeItem("four-rapier-best-" + zone);
          } catch {}
          best = null;
          updateHUD();
        }
      };
      $("sound").onclick = () => {
        soundEnabled = !soundEnabled;
        $("sound").textContent = "声音：" + (soundEnabled ? "开" : "关");
        if (soundEnabled && running) music.play().catch(() => {});
        else music.pause();
      };
      $("camera").onclick = () => {
        if (zone === "cyber") {
          spectator = !spectator;
          controls.enablePan = spectator;
        } else autoCamera = !autoCamera;
        updateHUD();
      };
      $("menu-toggle").onclick = () => {
        const expanded = document
          .querySelector(".hud")
          .classList.toggle("expanded");
        $("menu-toggle").textContent = expanded ? "设置 ▴" : "设置 ▾";
      };
      $("fullscreen").onclick = async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else {
            await document.documentElement.requestFullscreen();
            if (
              matchMedia("(pointer:coarse)").matches &&
              screen.orientation?.lock
            )
              screen.orientation.lock("landscape").catch(() => {});
          }
        } catch (e) {
          console.warn("Fullscreen unavailable", e);
        }
      };
      document.addEventListener("fullscreenchange", () => {
        $("fullscreen").textContent = document.fullscreenElement
          ? "退出全屏"
          : "全屏";
      });
      $("about").onclick = () => {
        $("help-title").textContent = zones[zone].name;
        $("help-text").textContent =
          zone === "space"
            ? "长按空格飞行，轨道引力波会引导坦克；走完 6 圈获得 102 分。"
            : zone === "snow"
              ? "WASD 控制坦克，按空格跳跃。逆时针跳跃得分，后退扣分，远距离跳跃可得 2 分。"
              : "依次驶向下一座平台 / 岛屿，完成 6 圈。WASD 移动，空格跳跃。";
        $("help").classList.remove("hidden");
      };
      $("close-help").onclick = () => $("help").classList.add("hidden");
      document
        .querySelectorAll("[data-zone]")
        .forEach((b) => (b.onclick = () => selectZone(b.dataset.zone)));
      window.addEventListener("keydown", (e) => {
        if (
          ["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(
            e.code,
          )
        )
          e.preventDefault();
        switch (e.code) {
          case "KeyW":
          case "ArrowUp":
            keyboard.f = 1;
            break;
          case "KeyS":
          case "ArrowDown":
            keyboard.f = -1;
            break;
          case "KeyA":
          case "ArrowLeft":
            keyboard.t = 1;
            break;
          case "KeyD":
          case "ArrowRight":
            keyboard.t = -1;
            break;
          case "Space":
            keyboard.jump = true;
        }
      });
      window.addEventListener("keyup", (e) => {
        switch (e.code) {
          case "KeyW":
          case "ArrowUp":
            if (keyboard.f > 0) keyboard.f = 0;
            break;
          case "KeyS":
          case "ArrowDown":
            if (keyboard.f < 0) keyboard.f = 0;
            break;
          case "KeyA":
          case "ArrowLeft":
            if (keyboard.t > 0) keyboard.t = 0;
            break;
          case "KeyD":
          case "ArrowRight":
            if (keyboard.t < 0) keyboard.t = 0;
            break;
          case "Space":
            keyboard.jump = false;
        }
      });
      window.addEventListener("blur", () => {
        keyboard.f = keyboard.t = 0;
        keyboard.jump = false;
        joy.x = joy.y = 0;
      });
      const stick = $("stick"),
        knob = $("knob");
      stick.onpointerdown = (e) => {
        e.preventDefault();
        stick.setPointerCapture(e.pointerId);
        moveStick(e);
      };
      stick.onpointermove = (e) => {
        if (stick.hasPointerCapture(e.pointerId)) moveStick(e);
      };
      stick.onpointerup = stick.onpointercancel = () => {
        joy.x = joy.y = 0;
        knob.style.transform = "translate(-50%,-50%)";
      };
      function moveStick(e) {
        const r = stick.getBoundingClientRect(),
          rad = r.width * 0.38,
          dx = e.clientX - r.left - r.width / 2,
          dy = e.clientY - r.top - r.height / 2,
          mag = Math.max(rad, Math.hypot(dx, dy));
        joy.x = dx / mag;
        joy.y = dy / mag;
        knob.style.transform = `translate(calc(-50% + ${joy.x * rad}px),calc(-50% + ${joy.y * rad}px)`;
      }
      $("jump").onpointerdown = (e) => {
        e.preventDefault();
        $("jump").setPointerCapture(e.pointerId);
        keyboard.jump = true;
      };
      $("jump").onpointerup = $("jump").onpointercancel = () =>
        (keyboard.jump = false);
      window.addEventListener("resize", () => {
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(innerWidth, innerHeight);
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
      });
      animate();
      selectZone("cyber");
    </script>
  </body>
</html>
